server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  absolute_redirect off;

  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self' https://api.stroy.com.kg" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

  location = /privacy { return 301 /privacy/; }
  location = /terms { return 301 /terms/; }
  location = /account-deletion { return 301 /account-deletion/; }
  location = /support { return 301 /support/; }
  location = /contact { return 301 /support/; }
  location = /api { return 404; }
  location ^~ /api/ { return 404; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico)$ {
    expires 1h;
  }
}
