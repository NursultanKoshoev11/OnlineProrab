server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  location = /privacy { return 301 /privacy/; }
  location = /terms { return 301 /terms/; }
  location = /account-deletion { return 301 /account-deletion/; }
  location = /support { return 301 /support/; }
  location = /contact { return 301 /support/; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
  }
}
