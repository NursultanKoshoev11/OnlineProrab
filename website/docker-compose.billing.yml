services:
  billing:
    image: stroy-obank-billing:production
    container_name: stroy-obank-billing
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=64m,mode=1777
      - /run:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- http://127.0.0.1/billing/ |
          grep -Fq '<title>Вход и подписка — STROY</title>'
          && wget -q --spider http://127.0.0.1/billing/billing.js
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      stroy:
        aliases:
          - billing

networks:
  stroy:
    external: true
    name: stroy_default
