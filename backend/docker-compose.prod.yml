services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    pull_policy: never
    container_name: stroy-api
    networks:
      - production_proxy
    environment:
      APP_ENV: production
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      STORAGE_DRIVER: s3
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS is required}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      S3_REGION: ${S3_REGION:?S3_REGION is required}
      S3_BUCKET: ${S3_BUCKET:?S3_BUCKET is required}
      S3_DELETION_LEDGER_BUCKET: ${S3_DELETION_LEDGER_BUCKET:?S3_DELETION_LEDGER_BUCKET is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      REVIEW_ONLY_MODE: ${REVIEW_ONLY_MODE:-false}
      REVIEW_SMS_PHONE: ${REVIEW_SMS_PHONE:-}
      REVIEW_SMS_PHONES: ${REVIEW_SMS_PHONES:-}
      REVIEW_SMS_CODE: ${REVIEW_SMS_CODE:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      NIKITA_API_URL: ${NIKITA_API_URL:-https://smspro.nikita.kg/api/message}
      NIKITA_LOGIN: ${NIKITA_LOGIN:-}
      NIKITA_PASSWORD: ${NIKITA_PASSWORD:-}
      NIKITA_SENDER: ${NIKITA_SENDER:-}
      NIKITA_TEST_MODE: ${NIKITA_TEST_MODE:-false}
      OBANK_ENABLED: ${OBANK_ENABLED:-false}
      OBANK_SID: ${OBANK_SID:-}
      OBANK_PASSWORD: ${OBANK_PASSWORD:-}
      OBANK_API_URL: ${OBANK_API_URL:-}
      OBANK_API_VERSION: ${OBANK_API_VERSION:-1005}
      OBANK_TEST: ${OBANK_TEST:-false}
      OBANK_TEST_ONLY_PHONE: ${OBANK_TEST_ONLY_PHONE:-}
      OBANK_TEST_PRICE_KGS: ${OBANK_TEST_PRICE_KGS:-0}
      SUBSCRIPTION_PRICE_OVERRIDE_KGS: ${SUBSCRIPTION_PRICE_OVERRIDE_KGS:-0}
      OBANK_RESULT_URL: ${OBANK_RESULT_URL:-}
      OBANK_RETURN_URL: ${OBANK_RETURN_URL:-https://stroy.com.kg/billing/}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-deepseek,gemini,groq,openrouter,openrouter-fallback}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-nex-agi/nex-n2.5-pro:free}
    expose:
      - "8080"
    volumes:
      - onlineprorab_uploads:/data/uploads
      - /etc/onlineprorab/postgres-ca.crt:/etc/onlineprorab/postgres-ca.crt:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: ${S3_REGION:?S3_REGION is required}
        awslogs-group: ${API_LOG_GROUP:?API_LOG_GROUP is required}
        awslogs-create-group: "false"
        mode: non-blocking
        max-buffer-size: 4m

volumes:
  onlineprorab_uploads:
    name: ${UPLOADS_VOLUME_NAME:-onlineprorab_uploads}

networks:
  production_proxy:
    external: true
    name: stroy_default
