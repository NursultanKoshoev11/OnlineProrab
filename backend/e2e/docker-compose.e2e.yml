services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: onlineprorab
      POSTGRES_PASSWORD: onlineprorab
      POSTGRES_DB: onlineprorab
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlineprorab -d onlineprorab"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://onlineprorab:onlineprorab@postgres:5432/onlineprorab?sslmode=disable
      JWT_SECRET: e2e-local-only-signing-key
      ACCESS_TOKEN_TTL_MINUTES: 15
      DEV_SMS_CODE_ENABLED: "true"
      E2E_TEST_MODE: "true"
      STORAGE_DRIVER: local
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: 10
      SMS_PROVIDER: ""
      NIKITA_API_URL: http://127.0.0.1:9/unused
      # E2E-only throwaway merchant values; these reach only fake-obank.
      OBANK_ENABLED: "true"
      OBANK_TEST: "true"
      OBANK_SID: e2e-only-sid
      OBANK_PASSWORD: e2e-only-password
      OBANK_API_URL: http://fake-obank:8091/api/json/json.php
      OBANK_PAYMENT_URL_BASE_URL: http://fake-obank:8091
      OBANK_RESULT_URL: http://127.0.0.1:8080/api/v1/payments/obank/result
      OBANK_RETURN_URL: http://127.0.0.1:8080/billing/
      # Push goes to the recording fake below. Generate the throwaway
      # credentials with fake-fcm/credentials.sh; without them push is off.
      FCM_PROJECT_ID: stroy-e2e
      FCM_SERVICE_ACCOUNT_JSON: ${E2E_FCM_SERVICE_ACCOUNT_JSON:-}
      FCM_API_BASE_URL: http://fake-fcm:8090
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - e2e_uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      fake-fcm:
        condition: service_healthy
      fake-obank:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready | grep -q '\"status\":\"ready\"'"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  fake-fcm:
    image: python:3.12-alpine
    command: ["python", "-u", "/fake-fcm/server.py"]
    volumes:
      - ./fake-fcm:/fake-fcm:ro
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health | grep -q ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  fake-obank:
    image: python:3.12-alpine
    command: ["python", "-u", "/fake-obank/server.py"]
    environment:
      FAKE_OBANK_SID: e2e-only-sid
      FAKE_OBANK_PASSWORD: e2e-only-password
      FAKE_OBANK_PAYMENT_BASE: http://fake-obank:8091
    volumes:
      - ./fake-obank:/fake-obank:ro
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health | grep -q ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  seed:
    image: postgres:16-alpine
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGUSER: onlineprorab
      PGPASSWORD: onlineprorab
      PGDATABASE: onlineprorab
    volumes:
      - ./seed.sql:/seed.sql:ro
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["sh", "-ec"]
    command: ["psql --set ON_ERROR_STOP=1 --file /seed.sql"]

volumes:
  e2e_postgres_data:
  e2e_uploads:
