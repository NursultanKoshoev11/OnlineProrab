appId: kg.com.stroy.app

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Номер телефона"
    timeout: 15000
- tapOn: "Номер телефона"
- eraseText: 20
- inputText: ${STAGING_TEST_PHONE}
- tapOn: "Получить код"
- extendedWaitUntil:
    visible: "Код из SMS"
    timeout: 20000
- tapOn: "Код из SMS"
- inputText: ${STAGING_TEST_CODE}
- tapOn: "Войти"
- extendedWaitUntil:
    visible: "Объекты"
    timeout: 30000
- assertVisible: "Добавить объект"
- assertNotVisible: "Не удалось загрузить"
