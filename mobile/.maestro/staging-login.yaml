appId: kg.com.stroy.app

---
- launchApp:
    clearState: true
- tapOn:
    text: "Wait"
    optional: true
- extendedWaitUntil:
    visible: "Номер телефона"
    timeout: 90000
- assertVisible: "Получить код"
- tapOn: "+996"
- eraseText: 20
- inputText: ${STAGING_TEST_PHONE}
- tapOn: "Получить код"
- extendedWaitUntil:
    visible: "Войти"
    timeout: 60000
- inputText: ${STAGING_TEST_CODE}
- tapOn: "Войти"
- extendedWaitUntil:
    visible: "Добавить объект"
    timeout: 120000
- assertVisible: "Добавить объект"
- assertNotVisible: "Не удалось загрузить"
