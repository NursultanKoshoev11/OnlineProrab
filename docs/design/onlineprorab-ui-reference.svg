    <g transform="translate(28 360)"><rect width="294" height="138" rx="18" class="card"/><rect x="12" y="12" width="105" height="72" rx="14" fill="#d8dfda"/><rect x="26" y="27" width="76" height="52" rx="5" fill="#657a70"/><text x="132" y="32" class="text body" font-weight="700">Коттедж Асана</text><text x="132" y="55" class="muted small">Чуйская область</text><rect x="12" y="103" width="222" height="8" rx="4" fill="#e8ece9"/><rect x="12" y="103" width="67" height="8" rx="4" class="green"/><text x="250" y="113" class="text small">30%</text></g>
    <g transform="translate(28 514)"><rect width="294" height="138" rx="18" class="card"/><rect x="12" y="12" width="105" height="72" rx="14" fill="#e1e5e2"/><path d="M20 76 L58 44 L107 78 V84 H20Z" fill="#52645b"/><text x="132" y="32" class="text body" font-weight="700">Дача родителей</text><text x="132" y="55" class="muted small">Иссык-Куль</text><rect x="12" y="103" width="222" height="8" rx="4" fill="#e8ece9"/><rect x="12" y="103" width="24" height="8" rx="4" class="green"/><text x="250" y="113" class="text small">10%</text></g>
