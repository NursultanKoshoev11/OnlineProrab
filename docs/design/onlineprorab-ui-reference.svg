<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity="0.12"/></filter>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#dfe8e2"/><stop offset="1" stop-color="#b9cfc3"/></linearGradient>
    <style>
      .bg{fill:#f7f8f6}.phone{fill:white;stroke:#202522;stroke-width:3}.card{fill:#fff;stroke:#e7ebe8;stroke-width:1.2}.soft{fill:#f3f6f4}.green{fill:#315f4d}.mint{fill:#dff2e7}.orange{fill:#fff0d6}.text{font-family:Arial,Helvetica,sans-serif;fill:#151b18}.muted{font-family:Arial,Helvetica,sans-serif;fill:#718078}.title{font-family:Arial,Helvetica,sans-serif;font-weight:700;fill:#101512}.small{font-size:13px}.body{font-size:16px}.h2{font-size:24px;font-weight:700}.h1{font-size:38px;font-weight:700}
    </style>
