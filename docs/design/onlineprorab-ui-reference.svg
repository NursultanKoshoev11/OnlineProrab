    <g transform="translate(28 528)"><rect width="294" height="72" rx="14" class="card"/><text x="16" y="28" class="text body" font-weight="700">Доставка</text><text x="16" y="51" class="muted small">11 мая 2024</text><text x="226" y="31" class="text body" font-weight="700">12 000</text></g>
    <g transform="translate(28 612)"><rect width="294" height="72" rx="14" class="card"/><text x="16" y="28" class="text body" font-weight="700">Доп. материалы</text><text x="16" y="51" class="muted small">16 мая 2024</text><text x="236" y="31" class="text body" font-weight="700">8 500</text></g>
