  <rect class="bg" width="1600" height="1000"/>
  <text x="70" y="70" class="text h1">OnlinePRorab</text>
  <text x="70" y="106" class="muted body">Минималистичный UI-референс · объекты · расходы · голосовой AI-поиск · аналитика</text>

