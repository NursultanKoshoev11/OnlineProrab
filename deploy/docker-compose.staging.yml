services:
  billing:
    build:
      context: ../website
      dockerfile: Dockerfile.billing
    container_name: stroy-obank-billing
    restart: unless-stopped
    networks:
      - staging_proxy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/billing/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  database:
    image: postgres:16-alpine
    container_name: stroy-obank-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STAGING_POSTGRES_DB:-onlineprorab_staging}
      POSTGRES_USER: ${STAGING_POSTGRES_USER:?STAGING_POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${STAGING_POSTGRES_PASSWORD:?STAGING_POSTGRES_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=trust
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql/tls/server.crt
      - -c
      - ssl_key_file=/etc/postgresql/tls/server.key
    networks:
      - staging_database
    volumes:
      - stroy_obank_staging_postgres:/var/lib/postgresql/data
      - ./staging-tls/server.crt:/etc/postgresql/tls/server.crt:ro
      - ./staging-tls/server.key:/etc/postgresql/tls/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: stroy-obank-staging-api
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    networks:
      - staging_proxy
      - staging_database
    environment:
      APP_ENV: staging
      HTTP_ADDR: :8080
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?TRUSTED_PROXY_CIDRS is required}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      SUPPORT_TELEGRAM_BOT_TOKEN: ${SUPPORT_TELEGRAM_BOT_TOKEN:-}
      SUPPORT_TELEGRAM_CHAT_ID: ${SUPPORT_TELEGRAM_CHAT_ID:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      DEV_SMS_CODE_ENABLED: "false"
      STAGING_TEST_SMS_PHONE: ${STAGING_TEST_SMS_PHONE:-}
      STAGING_TEST_SMS_CODE: ${STAGING_TEST_SMS_CODE:-}
      STAGING_TEST_PAYMENT_PRICE_KGS: ${STAGING_TEST_PAYMENT_PRICE_KGS:-0}
      REVIEW_ONLY_MODE: "false"
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      NIKITA_API_URL: https://smspro.nikita.kg/api/message
      NIKITA_LOGIN: ${NIKITA_LOGIN:-}
      NIKITA_PASSWORD: ${NIKITA_PASSWORD:-}
      NIKITA_SENDER: ${NIKITA_SENDER:-}
      NIKITA_TEST_MODE: "false"
      OBANK_ENABLED: ${OBANK_ENABLED:-false}
      OBANK_SID: ${OBANK_SID:-}
      OBANK_PASSWORD: ${OBANK_PASSWORD:-}
      OBANK_API_URL: ${OBANK_API_URL:-https://mw-api-test.dengi.kg/api/json/json.php}
      OBANK_API_VERSION: ${OBANK_API_VERSION:-1005}
      OBANK_TEST: "true"
      OBANK_RESULT_URL: ${OBANK_RESULT_URL:-}
      OBANK_RETURN_URL: ${OBANK_RETURN_URL:-https://stroy.com.kg/billing/}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      AI_PROVIDER_ORDER: ${AI_PROVIDER_ORDER:-gemini,groq,openrouter,openrouter-fallback}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_FALLBACK_MODEL: ${OPENROUTER_FALLBACK_MODEL:-nex-agi/nex-n2.5-pro:free}
    expose:
      - "8080"
    volumes:
      - stroy_obank_staging_uploads:/data/uploads
      - ./staging-tls/ca.crt:/etc/staging-tls/ca.crt:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  stroy_obank_staging_postgres:
    name: stroy_obank_staging_postgres
  stroy_obank_staging_uploads:
    name: stroy_obank_staging_uploads

networks:
  staging_proxy:
    external: true
    name: stroy_default
  staging_database:
    internal: true
