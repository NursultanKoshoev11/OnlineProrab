services:
  postgres:
    image: postgres:16-alpine
    container_name: stroy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${STROY_DB_NAME:-stroy}
      POSTGRES_USER: ${STROY_DB_USER:-stroy}
      POSTGRES_PASSWORD: ${STROY_DB_PASSWORD:?STROY_DB_PASSWORD is required}
    volumes:
      - stroy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${STROY_DB_USER:-stroy} -d ${STROY_DB_NAME:-stroy}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: stroy-api
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${STROY_DB_USER:-stroy}:${STROY_DB_PASSWORD}@postgres:5432/${STROY_DB_NAME:-stroy}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-60}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      UPLOAD_DIR: /data/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_API_KEY_SID: ${TWILIO_API_KEY_SID:-}
      TWILIO_API_KEY_SECRET: ${TWILIO_API_KEY_SECRET:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
    ports:
      - "127.0.0.1:${STROY_API_PORT:-8081}:8080"
    volumes:
      - stroy_uploads:/data/uploads
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  stroy_postgres_data:
    name: stroy_postgres_data
  stroy_uploads:
    name: stroy_uploads
