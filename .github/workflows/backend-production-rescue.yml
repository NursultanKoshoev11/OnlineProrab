name: Backend Production Rescue

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rescue:
    runs-on: [self-hosted, stroy-prod]
    timeout-minutes: 10
    environment: production-api
    env:
      DEPLOY_HOST: ${{ vars.API_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.API_DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH }}
      COMPOSE_PROJECT: ${{ vars.API_DEPLOY_COMPOSE_PROJECT }}
      DEPLOY_SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.API_DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Stop the stuck recovery and restore the API
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          install -m 700 -d "$RUNNER_TEMP/ssh"
          trap 'rm -f "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/ssh/id_ed25519"
          chmod 600 "$RUNNER_TEMP/ssh/known_hosts"
          ssh_opts=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2 -i "$RUNNER_TEMP/ssh/id_ed25519")

          rescue_remote() {
            local skip_cleanup="$1"
            timeout --signal=TERM --kill-after=15s 6m \
              ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH=$DEPLOY_PATH COMPOSE_PROJECT=$COMPOSE_PROJECT SKIP_CLEANUP=$skip_cleanup bash -s" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="${DEPLOY_PATH:-/opt/stroy-api}"
          compose_project="${COMPOSE_PROJECT:-backend}"
          env_file="$deploy_path/.env"
          current_link="$deploy_path/current"

          if [[ "${SKIP_CLEANUP:-0}" != 1 ]]; then
            # Stop only the interrupted API Compose command so the recovery can
            # release Docker's project lock.
            mapfile -t stuck_pids < <(ps -eo pid=,args= | awk '/docker compose/ && /docker-compose\.prod\.yml/ {print $1}')
            for pid in "${stuck_pids[@]}"; do
              [[ "$pid" =~ ^[0-9]+$ ]] && kill -TERM "$pid" 2>/dev/null || true
            done
            sleep 3
            for pid in "${stuck_pids[@]}"; do
              if [[ "$pid" =~ ^[0-9]+$ ]] && kill -0 "$pid" 2>/dev/null; then
                kill -KILL "$pid" 2>/dev/null || true
              fi
            done

            # A wedged Docker client can leave the daemon unable to remove the
            # old container. Stop deploy-user Docker clients before the API call.
            mapfile -t stale_client_pids < <(ps -eo pid=,user=,args= | awk -v user="$USER" '$2 == user && /(^|[[:space:]])docker([[:space:]]|$)/ {print $1}')
            for pid in "${stale_client_pids[@]}"; do
              [[ "$pid" =~ ^[0-9]+$ && "$pid" != "$$" ]] && kill -TERM "$pid" 2>/dev/null || true
            done
            sleep 2
            for pid in "${stale_client_pids[@]}"; do
              if [[ "$pid" =~ ^[0-9]+$ && "$pid" != "$$" ]] && kill -0 "$pid" 2>/dev/null; then
                kill -KILL "$pid" 2>/dev/null || true
              fi
            done

            stale_ids="$(timeout --signal=TERM --kill-after=10s 30s docker ps --all --quiet --filter name=stroy-api || true)"
            if [[ -n "$stale_ids" ]]; then
              if ! timeout --signal=TERM --kill-after=10s 60s docker rm --force $stale_ids; then
                echo "Docker did not remove the stale API container; restarting the deploy user's Docker service."
                restart_status=0
                timeout --signal=TERM --kill-after=15s 90s systemctl --user restart docker.service || restart_status=$?
                if [[ "$restart_status" -ne 0 ]]; then
                  echo "The deploy user's Docker service did not restart; terminating only its rootless daemon."
                  mapfile -t daemon_pids < <(ps -eo pid=,user=,args= | awk -v user="$USER" '$2 == user && (/dockerd-rootless/ || /rootlesskit[[:space:]].*dockerd/) {print $1}')
                  for pid in "${daemon_pids[@]}"; do
                    [[ "$pid" =~ ^[0-9]+$ && "$pid" != "$$" ]] && kill -TERM "$pid" 2>/dev/null || true
                  done
                  sleep 5
                  for pid in "${daemon_pids[@]}"; do
                    if [[ "$pid" =~ ^[0-9]+$ && "$pid" != "$$" ]] && kill -0 "$pid" 2>/dev/null; then
                      kill -KILL "$pid" 2>/dev/null || true
                    fi
                  done
                  sleep 5
                fi
                if ! timeout --signal=TERM --kill-after=10s 30s docker info >/dev/null 2>&1; then
                  echo "The deploy user's Docker daemon did not recover; a host-level restart is required." >&2
                  exit 42
                fi
                stale_ids="$(timeout --signal=TERM --kill-after=10s 30s docker ps --all --quiet --filter name=stroy-api || true)"
                if [[ -n "$stale_ids" ]] && ! timeout --signal=TERM --kill-after=10s 60s docker rm --force $stale_ids; then
                  echo "The stale API container still cannot be removed after restarting Docker." >&2
                  exit 42
                fi
              fi
            fi
          fi

          if [[ -L "$current_link" ]]; then
            current_release="$(readlink -f -- "$current_link")"
          else
            latest_release="$(find "$deploy_path/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | head -n1 | cut -d' ' -f2- || true)"
            [[ -n "$latest_release" ]]
            previous_ref="$(cat -- "$latest_release/previous-release" 2>/dev/null || true)"
            if [[ -n "$previous_ref" && -d "$deploy_path/$previous_ref" ]]; then
              current_release="$deploy_path/$previous_ref"
            else
              current_release="$latest_release"
            fi
          fi

          compose_file="$current_release/backend/docker-compose.prod.yml"
          image_ref="$(cat -- "$current_release/image-tag")"
          [[ "$current_release" == "$deploy_path/releases/"* ]]
          [[ "$image_ref" =~ ^stroy-api:(baseline|[0-9a-f]{40})$ ]]
          [[ -f "$env_file" && -f "$compose_file" ]]
          echo "Restoring $image_ref from $current_release"
          API_IMAGE="$image_ref" timeout --signal=TERM --kill-after=15s 120s docker compose --project-name "$compose_project" --env-file "$env_file" --file "$compose_file" up --detach --no-build --pull never api

          for attempt in $(seq 1 36); do
            status="$(timeout --signal=TERM --kill-after=5s 10s docker inspect --format '{{.State.Health.Status}}' stroy-api 2>/dev/null || true)"
            echo "health attempt $attempt: ${status:-missing}"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == unhealthy || "$status" == exited || "$status" == dead ]]; then
              timeout --signal=TERM --kill-after=5s 10s docker logs --tail 120 stroy-api || true
              exit 1
            fi
            sleep 5
          done
          timeout --signal=TERM --kill-after=5s 10s docker logs --tail 120 stroy-api || true
          exit 1
          REMOTE
          }

          set +e
          rescue_remote 0
          remote_status=$?
          set -e
          if [[ "$remote_status" -eq 42 ]]; then
            echo "The production Docker daemon requires a host-level restart outside the deploy user's permissions." >&2
            exit 1
          elif [[ "$remote_status" -ne 0 ]]; then
            exit "$remote_status"
          fi
