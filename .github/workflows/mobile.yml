name: Mobile CI

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API URL for the test APK'
        required: true
        default: 'http://127.0.0.1:8080'
        type: string
      offline_demo:
        description: 'Run the APK with built-in demo data and no server'
        required: true
        default: 'true'
        type: string
      production_release:
        description: 'Build the signed production AAB (requires GitHub secrets/variables)'
        required: true
        default: 'false'
        type: string
      production_ios_release:
        description: 'Build the signed production IPA (requires Apple signing secrets/variables)'
        required: true
        default: 'false'
        type: string
      google_play_track:
        description: 'Google Play track for a manually requested signed release'
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - production
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: offline
            api_base_url: http://127.0.0.1:8080
            offline_demo: 'true'
          - name: online
            api_base_url: https://api.stroy.com.kg
            offline_demo: 'false'
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Google Play target API requirement
        run: python3 tool/validate_android_target_sdk.py --minimum 36

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install and verify Android NDK
        run: python3 tool/install_android_ndk.py

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate adaptive STROY launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze application
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        env:
          API_BASE_URL: ${{ matrix.build.api_base_url }}
          OFFLINE_DEMO: ${{ matrix.build.offline_demo }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=OFFLINE_DEMO="$OFFLINE_DEMO"

      - name: Name debug APK for STROY
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/stroy-${{ matrix.build.name }}-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-${{ matrix.build.name }}-debug-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/stroy-${{ matrix.build.name }}-debug.apk
          if-no-files-found: error
          retention-days: 14

  android-release-gate:
    name: Check Android release signing configuration
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.production_release == 'true'))
    runs-on: ubuntu-latest
    environment: production-mobile
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.signing.outputs.ready }}
    steps:
      - name: Check for the existing Play upload key
        id: signing
        env:
          API_STORAGE_CUTOVER_COMPLETE: ${{ vars.API_STORAGE_CUTOVER_COMPLETE }}
          STROY_APPLICATION_ID: ${{ vars.STROY_APPLICATION_ID }}
          STROY_KEYSTORE_BASE64: ${{ secrets.STROY_KEYSTORE_BASE64 }}
          STROY_KEYSTORE_PASSWORD: ${{ secrets.STROY_KEYSTORE_PASSWORD }}
          STROY_KEY_ALIAS: ${{ secrets.STROY_KEY_ALIAS }}
          STROY_KEY_PASSWORD: ${{ secrets.STROY_KEY_PASSWORD }}
          GOOGLE_PLAY_PACKAGE_NAME: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ "$API_STORAGE_CUTOVER_COMPLETE" == 'true' && -n "$STROY_APPLICATION_ID" && -n "$STROY_KEYSTORE_BASE64" && -n "$STROY_KEYSTORE_PASSWORD" && -n "$STROY_KEY_ALIAS" && -n "$STROY_KEY_PASSWORD" && -n "$GOOGLE_PLAY_PACKAGE_NAME" && -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Production API cutover, Android signing, and Google Play closed-testing upload are configured; AAB and APK builds will run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            if [[ "$API_STORAGE_CUTOVER_COMPLETE" != 'true' ]]; then
              echo 'Android signed release was skipped because the production API still serves staging data. Debug APK artifacts were still built.' >> "$GITHUB_STEP_SUMMARY"
            fi
            if [[ -z "$STROY_APPLICATION_ID" || -z "$STROY_KEYSTORE_BASE64" || -z "$STROY_KEYSTORE_PASSWORD" || -z "$STROY_KEY_ALIAS" || -z "$STROY_KEY_PASSWORD" ]]; then
              echo 'Android signed release was skipped because the existing Google Play upload keystore and credentials are not configured in production-mobile.' >> "$GITHUB_STEP_SUMMARY"
            fi
            if [[ -z "$GOOGLE_PLAY_PACKAGE_NAME" || -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
              echo 'Android signed release was skipped because the Google Play service account or package variable is not configured in production-mobile.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

  ios-release-gate:
    name: Check production API readiness for iOS release
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.production_ios_release == 'true'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.readiness.outputs.ready }}
    steps:
      - name: Keep signed store builds on production data
        id: readiness
        env:
          API_STORAGE_CUTOVER_COMPLETE: ${{ vars.API_STORAGE_CUTOVER_COMPLETE }}
        run: |
          set -euo pipefail
          if [[ "$API_STORAGE_CUTOVER_COMPLETE" == 'true' ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Production API cutover is complete; the signed iOS release build will run.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Signed iOS release was skipped because the production API still serves staging data. The iOS simulator artifact is still built.' >> "$GITHUB_STEP_SUMMARY"
          fi

  production-bundle:
    needs: android-release-gate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.production_release == 'true')) &&
      needs.android-release-gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    environment: production-mobile
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    env:
      STROY_APPLICATION_ID: ${{ vars.STROY_APPLICATION_ID }}
      STROY_KEYSTORE_PATH: ${{ github.workspace }}/mobile/stroy-upload.jks
      STROY_KEYSTORE_PASSWORD: ${{ secrets.STROY_KEYSTORE_PASSWORD }}
      STROY_KEY_ALIAS: ${{ secrets.STROY_KEY_ALIAS }}
      STROY_KEY_PASSWORD: ${{ secrets.STROY_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Google Play target API requirement
        run: python3 tool/validate_android_target_sdk.py --minimum 36

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Decode upload keystore
        env:
          STROY_KEYSTORE_BASE64: ${{ secrets.STROY_KEYSTORE_BASE64 }}
        run: |
          test -n "$STROY_KEYSTORE_BASE64"
          printf '%s' "$STROY_KEYSTORE_BASE64" | base64 --decode > "$STROY_KEYSTORE_PATH"
          test -s "$STROY_KEYSTORE_PATH"

      - name: Validate production release inputs
        run: |
          test -n "$STROY_APPLICATION_ID"
          test -n "$STROY_KEYSTORE_PASSWORD"
          test -n "$STROY_KEY_ALIAS"
          test -n "$STROY_KEY_PASSWORD"

      - name: Verify public privacy and account-deletion pages
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            https://stroy.com.kg/privacy/ --output "$RUNNER_TEMP/stroy-privacy.html"
          grep -Fq 'Политика конфиденциальности' "$RUNNER_TEMP/stroy-privacy.html"
          grep -Fq 'Google Gemini' "$RUNNER_TEMP/stroy-privacy.html"
          grep -Fq 'бессрочно храним в закрытом журнале' "$RUNNER_TEMP/stroy-privacy.html"
          curl --fail --silent --show-error --location --max-time 30 \
            https://stroy.com.kg/account-deletion/ --output "$RUNNER_TEMP/stroy-account-deletion.html"
          grep -Fq 'Удаление аккаунта' "$RUNNER_TEMP/stroy-account-deletion.html"
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 \
            https://api.stroy.com.kg/api/v1/account/deletion/verify)"
          if [[ "$api_status" != '405' ]]; then
            echo "Account-deletion API route returned HTTP $api_status; expected 405 for GET." >&2
            exit 1
          fi

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install and verify Android NDK
        run: python3 tool/install_android_ndk.py

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate adaptive STROY launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze application
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test

      - name: Build signed production AAB
        run: flutter build appbundle --release --build-number "${{ github.run_number }}" --dart-define=API_BASE_URL=https://api.stroy.com.kg --dart-define=OFFLINE_DEMO=false --dart-define=OBANK_NATIVE_CHECKOUT_ENABLED=true --dart-define=OBANK_STAGING_BUILD=false

      - name: Build signed production APK
        run: flutter build apk --release --build-number "${{ github.run_number }}" --dart-define=API_BASE_URL=https://api.stroy.com.kg --dart-define=OFFLINE_DEMO=false --dart-define=OBANK_NATIVE_CHECKOUT_ENABLED=true --dart-define=OBANK_STAGING_BUILD=false

      - name: Upload production AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-production-aab-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.GOOGLE_PLAY_PACKAGE_NAME }}
          releaseFiles: mobile/build/app/outputs/bundle/release/app-release.aab
          # Pushes stay on alpha; a manual production_release can explicitly choose production.
          tracks: ${{ inputs.google_play_track || 'alpha' }}
          status: completed

      - name: Upload production APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-production-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove upload keystore
        if: always()
        run: rm -f "$STROY_KEYSTORE_PATH"

  ios-simulator:
    name: Staging iOS simulator build
    runs-on: macos-26
    defaults:
      run:
        working-directory: mobile
    env:
      STROY_IOS_BUNDLE_ID: kg.com.stroy.app.staging

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Verify App Store Connect SDK requirements
        run: bash tool/validate_app_store_toolchain.sh

      - name: Test App Store profile validation
        run: python3 -m unittest discover -s tool -p 'test_validate_ios_profile.py'

      - name: Prepare platform configuration
        run: |
          python3 tool/prepare_android.py
          python3 tool/configure_ios_bundle_id.py "$STROY_IOS_BUNDLE_ID"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze application
        run: flutter analyze lib test

      - name: Run tests
        run: flutter test

      - name: Build iOS simulator app
        run: flutter build ios --simulator --debug --no-codesign --dart-define=API_BASE_URL=https://stroy.com.kg/staging-api --dart-define=OFFLINE_DEMO=false --dart-define=OBANK_NATIVE_CHECKOUT_ENABLED=true --dart-define=OBANK_STAGING_BUILD=true

      - name: Validate bundled iOS privacy manifest
        run: python3 tool/validate_privacy_manifest.py --app-bundle build/ios/iphonesimulator/Runner.app

      - name: Package iOS simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app "$RUNNER_TEMP/stroy-staging-ios-simulator.zip"

      - name: Upload staging iOS simulator app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-staging-ios-simulator-${{ github.run_number }}
          path: ${{ runner.temp }}/stroy-staging-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14

  production-ios-ipa:
    name: Signed iOS IPA
    needs: ios-release-gate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.production_ios_release == 'true')) &&
      needs.ios-release-gate.outputs.ready == 'true'
    runs-on: macos-26
    environment: production-mobile
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    env:
      STROY_IOS_BUNDLE_ID: ${{ vars.STROY_IOS_BUNDLE_ID || 'com.koshoev.stroy' }}
      STROY_IOS_TEAM_ID: ${{ vars.STROY_IOS_TEAM_ID }}
      STROY_KEYCHAIN_PATH: ${{ github.workspace }}/stroy-ios-signing.keychain-db

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Verify App Store Connect SDK requirements
        run: bash tool/validate_app_store_toolchain.sh

      - name: Validate iOS release settings
        run: |
          test -n "$STROY_IOS_BUNDLE_ID"
          [[ "$STROY_IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          python3 tool/configure_ios_bundle_id.py "$STROY_IOS_BUNDLE_ID"

      - name: Create temporary signing keychain
        env:
          STROY_IOS_CERTIFICATE_BASE64: ${{ secrets.STROY_IOS_CERTIFICATE_BASE64 }}
          STROY_IOS_CERTIFICATE_PASSWORD: ${{ secrets.STROY_IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STROY_IOS_CERTIFICATE_BASE64"
          test -n "$STROY_IOS_CERTIFICATE_PASSWORD"
          STROY_TEMP_KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "STROY_TEMP_KEYCHAIN_PASSWORD=$STROY_TEMP_KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$STROY_TEMP_KEYCHAIN_PASSWORD" "$STROY_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$STROY_KEYCHAIN_PATH"
          security unlock-keychain -p "$STROY_TEMP_KEYCHAIN_PASSWORD" "$STROY_KEYCHAIN_PATH"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          certificate = base64.b64decode(os.environ["STROY_IOS_CERTIFICATE_BASE64"], validate=True)
          Path(os.environ["RUNNER_TEMP"], "stroy-distribution.p12").write_bytes(certificate)
          PY
          security import "$RUNNER_TEMP/stroy-distribution.p12" \
            -k "$STROY_KEYCHAIN_PATH" \
            -P "$STROY_IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$STROY_TEMP_KEYCHAIN_PASSWORD" \
            "$STROY_KEYCHAIN_PATH"
          STROY_IOS_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$STROY_KEYCHAIN_PATH" | awk -F '"' '/Apple Distribution/ {print $2; exit}')"
          test -n "$STROY_IOS_SIGNING_IDENTITY"
          case "$STROY_IOS_SIGNING_IDENTITY" in
            *"($STROY_IOS_TEAM_ID)") ;;
            *) echo "Apple Distribution certificate does not match STROY_IOS_TEAM_ID" >&2; exit 1 ;;
          esac
          echo "STROY_IOS_SIGNING_IDENTITY=$STROY_IOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          security list-keychains -d user -s "$STROY_KEYCHAIN_PATH"
          security default-keychain -d user -s "$STROY_KEYCHAIN_PATH"

      - name: Install and validate App Store provisioning profile
        env:
          STROY_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.STROY_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$STROY_IOS_PROVISIONING_PROFILE_BASE64"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          profile = base64.b64decode(os.environ["STROY_IOS_PROVISIONING_PROFILE_BASE64"], validate=True)
          profile_path = Path(os.environ["RUNNER_TEMP"], "stroy-app-store.mobileprovision")
          profile_path.write_bytes(profile)
          PY
          security cms -D -i "$RUNNER_TEMP/stroy-app-store.mobileprovision" > "$RUNNER_TEMP/stroy-profile.plist"
          STROY_IOS_PROFILE_UUID="$(python3 tool/validate_ios_profile.py \
            --profile "$RUNNER_TEMP/stroy-profile.plist" \
            --team-id "$STROY_IOS_TEAM_ID" \
            --bundle-id "$STROY_IOS_BUNDLE_ID")"
          cp "$RUNNER_TEMP/stroy-app-store.mobileprovision" "$PROFILE_DIR/$STROY_IOS_PROFILE_UUID.mobileprovision"
          echo "STROY_IOS_PROFILE_UUID=$STROY_IOS_PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze application
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Prepare iOS release build
        run: flutter build ios --release --no-codesign --build-name 1.0.0 --build-number ${{ github.run_number }} --dart-define=API_BASE_URL=https://api.stroy.com.kg --dart-define=OFFLINE_DEMO=false --dart-define=OBANK_NATIVE_CHECKOUT_ENABLED=true --dart-define=OBANK_STAGING_BUILD=false

      - name: Configure signing for the Runner app target
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          values = {
              "CODE_SIGN_STYLE": "Manual",
              "CODE_SIGN_IDENTITY": os.environ["STROY_IOS_SIGNING_IDENTITY"],
              "DEVELOPMENT_TEAM": os.environ["STROY_IOS_TEAM_ID"],
              "PROVISIONING_PROFILE_SPECIFIER": os.environ["STROY_IOS_PROFILE_UUID"],
              "PRODUCT_BUNDLE_IDENTIFIER": os.environ["STROY_IOS_BUNDLE_ID"],
          }
          lines = [f"{key} = {value}" for key, value in values.items()]
          Path("ios/Flutter/ProductionSigning.xcconfig").write_text("\n".join(lines) + "\n")
          PY

      - name: Create signed App Store archive
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/STROY.xcarchive" \
            archive

      - name: Validate archived iOS privacy manifest
        run: |
          APP_BUNDLE="$(find "$RUNNER_TEMP/STROY.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP_BUNDLE"
          python3 tool/validate_privacy_manifest.py --app-bundle "$APP_BUNDLE"

      - name: Export signed IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              "method": "app-store",
              "signingStyle": "manual",
              "teamID": os.environ["STROY_IOS_TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["STROY_IOS_BUNDLE_ID"]: os.environ["STROY_IOS_PROFILE_UUID"]
              },
              "stripSwiftSymbols": True,
              "uploadSymbols": True,
          }
          Path(os.environ["RUNNER_TEMP"], "stroy-export-options.plist").write_bytes(
              plistlib.dumps(options)
          )
          PY
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/STROY.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/stroy-export-options.plist" \
            -exportPath "$RUNNER_TEMP/stroy-ipa"
          IPA_PATH="$(find "$RUNNER_TEMP/stroy-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          test -s "$IPA_PATH"

      - name: Prepare App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY_P8"
          [[ "$ASC_KEY_ID" =~ ^[A-Z0-9]+$ ]]
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${ASC_KEY_ID}.p8"
          python3 - <<'PY'
          import os
          from pathlib import Path

          key = os.environ["ASC_PRIVATE_KEY_P8"].replace("\r\n", "\n")
          Path(os.environ["RUNNER_TEMP"], "private_keys", f"AuthKey_{os.environ['ASC_KEY_ID']}.p8").write_text(key, encoding="utf-8")
          PY
          openssl pkey -in "$KEY_PATH" -noout
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      - name: Validate IPA with Apple
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --validate-app \
            --type ios \
            --file "$(find "$RUNNER_TEMP/stroy-ipa" -maxdepth 1 -name '*.ipa' -print -quit)" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --p8-file-path "$ASC_KEY_PATH"

      - name: Upload IPA to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA_PATH="$(find "$RUNNER_TEMP/stroy-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --p8-file-path "$ASC_KEY_PATH" \
            --verbose

      - name: Upload signed IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-production-ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/stroy-ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing configuration
        if: always()
        run: rm -f ios/Flutter/ProductionSigning.xcconfig && rm -rf "$RUNNER_TEMP/private_keys"

      - name: Check live App Store privacy and account-deletion readiness
        id: public_readiness
        continue-on-error: true
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 30 \
            https://stroy.com.kg/privacy/ --output "$RUNNER_TEMP/stroy-privacy.html"
          grep -Fq 'Политика конфиденциальности' "$RUNNER_TEMP/stroy-privacy.html"
          grep -Fq 'Google Gemini' "$RUNNER_TEMP/stroy-privacy.html"
          grep -Fq 'бессрочно храним в закрытом журнале' "$RUNNER_TEMP/stroy-privacy.html"
          curl --fail --silent --show-error --location --max-time 30 \
            https://stroy.com.kg/account-deletion/ --output "$RUNNER_TEMP/stroy-account-deletion.html"
          grep -Fq 'Удаление аккаунта' "$RUNNER_TEMP/stroy-account-deletion.html"
          api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 30 \
            https://api.stroy.com.kg/api/v1/account/deletion/verify)"
          if [[ "$api_status" != '405' ]]; then
            echo "Account-deletion API route returned HTTP $api_status; expected 405 for GET." >&2
            exit 1
          fi

      - name: Report App Store submission readiness
        if: steps.public_readiness.outcome == 'failure'
        run: |
          echo "::warning title=IPA generated, App Store submission blocked::The signed IPA is available, but the live privacy/account-deletion checks failed. Add in-app account deletion and make its completion path work before submitting for review."
          {
            echo '## Signed IPA generated; App Store submission is not ready'
            echo
            echo '- The IPA artifact is available for inspection or TestFlight.'
            echo '- The live privacy/account-deletion checks failed. The current app also has no in-app account-deletion entry point.'
            echo '- Do not submit this build for App Review until account deletion is available from inside the app and its completion path works.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing materials
        if: always()
        run: |
          security delete-keychain "$STROY_KEYCHAIN_PATH" || true
          if [ -n "${STROY_IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$STROY_IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/stroy-distribution.p12" \
            "$RUNNER_TEMP/stroy-app-store.mobileprovision" \
            "$RUNNER_TEMP/stroy-profile.plist" \
            "$RUNNER_TEMP/stroy-export-options.plist"
