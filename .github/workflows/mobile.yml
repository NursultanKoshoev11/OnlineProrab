name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: write

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Apply test fix and Dart formatter
        shell: bash
        run: |
          sed -i 's/throw const http.ClientException/throw http.ClientException/' test/api_client_test.dart
          dart format lib/services/api_client.dart test/api_client_test.dart test/expense_search_query_test.dart

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- lib/services/api_client.dart test/api_client_test.dart test/expense_search_query_test.dart; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/api_client.dart test/api_client_test.dart test/expense_search_query_test.dart
          git commit -m "Format project start date changes"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Analyze application
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8080

      - name: Build release APK compile check
        run: flutter build apk --release --dart-define=API_BASE_URL=http://127.0.0.1:8080
