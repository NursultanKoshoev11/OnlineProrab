name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: write

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format redesigned UI
        run: >-
          dart format
          lib/main.dart
          lib/app/online_prorab_redesign.dart
          lib/app/redesign
          test/widget_test.dart

      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- lib/main.dart lib/app/online_prorab_redesign.dart lib/app/redesign test/widget_test.dart; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/app/online_prorab_redesign.dart lib/app/redesign test/widget_test.dart
          git commit -m "Format redesigned mobile UI"
          git push origin HEAD:main

      - name: Analyze active application
        run: flutter analyze lib/main.dart lib/app/online_prorab_redesign.dart

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8080

      - name: Build release APK compile check
        run: flutter build apk --release --dart-define=API_BASE_URL=http://127.0.0.1:8080
