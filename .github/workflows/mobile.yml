name: Mobile CI

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API URL for the test APK'
        required: true
        default: 'http://127.0.0.1:8080'
        type: string
      offline_demo:
        description: 'Run the APK with built-in demo data and no server'
        required: true
        default: 'true'
        type: string
      production_release:
        description: 'Build the signed production AAB (requires GitHub secrets/variables)'
        required: true
        default: 'false'
        type: string
      production_ios_release:
        description: 'Build the signed production IPA (requires Apple signing secrets/variables)'
        required: true
        default: 'false'
        type: string
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: offline
            api_base_url: http://127.0.0.1:8080
            offline_demo: 'true'
          - name: online
            api_base_url: https://api.stroy.com.kg
            offline_demo: 'false'
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate adaptive STROY launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze application
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        env:
          API_BASE_URL: ${{ matrix.build.api_base_url }}
          OFFLINE_DEMO: ${{ matrix.build.offline_demo }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=OFFLINE_DEMO="$OFFLINE_DEMO"

      - name: Name debug APK for STROY
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/stroy-${{ matrix.build.name }}-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-${{ matrix.build.name }}-debug-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/stroy-${{ matrix.build.name }}-debug.apk
          if-no-files-found: error
          retention-days: 14

  production-bundle:
    if: github.event_name == 'workflow_dispatch' && inputs.production_release == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production-mobile
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    env:
      STROY_APPLICATION_ID: ${{ vars.STROY_APPLICATION_ID }}
      STROY_KEYSTORE_PATH: ${{ github.workspace }}/mobile/stroy-upload.jks
      STROY_KEYSTORE_PASSWORD: ${{ secrets.STROY_KEYSTORE_PASSWORD }}
      STROY_KEY_ALIAS: ${{ secrets.STROY_KEY_ALIAS }}
      STROY_KEY_PASSWORD: ${{ secrets.STROY_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Decode upload keystore
        env:
          STROY_KEYSTORE_BASE64: ${{ secrets.STROY_KEYSTORE_BASE64 }}
        run: |
          test -n "$STROY_KEYSTORE_BASE64"
          printf '%s' "$STROY_KEYSTORE_BASE64" | base64 --decode > "$STROY_KEYSTORE_PATH"
          test -s "$STROY_KEYSTORE_PATH"

      - name: Validate production release inputs
        run: |
          test -n "$STROY_APPLICATION_ID"
          test -n "$STROY_KEYSTORE_PASSWORD"
          test -n "$STROY_KEY_ALIAS"
          test -n "$STROY_KEY_PASSWORD"

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate adaptive STROY launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze application
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build signed production AAB
        run: flutter build appbundle --release --dart-define=API_BASE_URL=https://api.stroy.com.kg --dart-define=OFFLINE_DEMO=false

      - name: Upload production AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-production-aab-${{ github.run_number }}
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove upload keystore
        if: always()
        run: rm -f "$STROY_KEYSTORE_PATH"

  ios-simulator:
    name: iOS simulator build
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    env:
      STROY_IOS_BUNDLE_ID: kg.com.stroy.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Show toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Prepare platform configuration
        run: |
          python3 tool/prepare_android.py
          python3 tool/configure_ios_bundle_id.py "$STROY_IOS_BUNDLE_ID"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze application
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-codesign --dart-define=API_BASE_URL=https://api.stroy.com.kg --dart-define=OFFLINE_DEMO=false

  production-ios-ipa:
    name: Signed iOS IPA
    if: github.event_name == 'workflow_dispatch' && inputs.production_ios_release == 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: production-mobile
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    env:
      STROY_IOS_BUNDLE_ID: ${{ vars.STROY_IOS_BUNDLE_ID }}
      STROY_IOS_TEAM_ID: ${{ vars.STROY_IOS_TEAM_ID }}
      STROY_KEYCHAIN_PATH: ${{ github.workspace }}/stroy-ios-signing.keychain-db

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Validate iOS release settings
        run: |
          test -n "$STROY_IOS_BUNDLE_ID"
          [[ "$STROY_IOS_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]
          python3 tool/configure_ios_bundle_id.py "$STROY_IOS_BUNDLE_ID"

      - name: Create temporary signing keychain
        env:
          STROY_IOS_CERTIFICATE_BASE64: ${{ secrets.STROY_IOS_CERTIFICATE_BASE64 }}
          STROY_IOS_CERTIFICATE_PASSWORD: ${{ secrets.STROY_IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$STROY_IOS_CERTIFICATE_BASE64"
          test -n "$STROY_IOS_CERTIFICATE_PASSWORD"
          STROY_TEMP_KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "STROY_TEMP_KEYCHAIN_PASSWORD=$STROY_TEMP_KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$STROY_TEMP_KEYCHAIN_PASSWORD" "$STROY_KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$STROY_KEYCHAIN_PATH"
          security unlock-keychain -p "$STROY_TEMP_KEYCHAIN_PASSWORD" "$STROY_KEYCHAIN_PATH"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          certificate = base64.b64decode(os.environ["STROY_IOS_CERTIFICATE_BASE64"], validate=True)
          Path(os.environ["RUNNER_TEMP"], "stroy-distribution.p12").write_bytes(certificate)
          PY
          security import "$RUNNER_TEMP/stroy-distribution.p12" \
            -k "$STROY_KEYCHAIN_PATH" \
            -P "$STROY_IOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$STROY_TEMP_KEYCHAIN_PASSWORD" \
            "$STROY_KEYCHAIN_PATH"
          STROY_IOS_SIGNING_IDENTITY="$(security find-identity -v -p codesigning "$STROY_KEYCHAIN_PATH" | awk -F '"' '/Apple Distribution/ {print $2; exit}')"
          test -n "$STROY_IOS_SIGNING_IDENTITY"
          case "$STROY_IOS_SIGNING_IDENTITY" in
            *"($STROY_IOS_TEAM_ID)") ;;
            *) echo "Apple Distribution certificate does not match STROY_IOS_TEAM_ID" >&2; exit 1 ;;
          esac
          echo "STROY_IOS_SIGNING_IDENTITY=$STROY_IOS_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          security list-keychains -d user -s "$STROY_KEYCHAIN_PATH"
          security default-keychain -d user -s "$STROY_KEYCHAIN_PATH"

      - name: Install and validate App Store provisioning profile
        env:
          STROY_IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.STROY_IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$STROY_IOS_PROVISIONING_PROFILE_BASE64"
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          python3 - <<'PY'
          import base64
          from datetime import datetime, timezone
          import os
          import plistlib
          from pathlib import Path

          profile = base64.b64decode(os.environ["STROY_IOS_PROVISIONING_PROFILE_BASE64"], validate=True)
          profile_path = Path(os.environ["RUNNER_TEMP"], "stroy-app-store.mobileprovision")
          profile_path.write_bytes(profile)
          with profile_path.open("rb") as stream:
              expiration = plistlib.load(stream)["ExpirationDate"]
          if expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=timezone.utc)
          if expiration <= datetime.now(timezone.utc):
              raise SystemExit("App Store provisioning profile is expired")
          PY
          security cms -D -i "$RUNNER_TEMP/stroy-app-store.mobileprovision" > "$RUNNER_TEMP/stroy-profile.plist"
          PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/stroy-profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/stroy-profile.plist")"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/stroy-profile.plist")"
          PROFILE_APP_ID="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/stroy-profile.plist")"
          test "$PROFILE_TEAM_ID" = "$STROY_IOS_TEAM_ID"
          case "$PROFILE_APP_ID" in
            *".$STROY_IOS_BUNDLE_ID") ;;
            *) echo "Provisioning profile does not match STROY_IOS_BUNDLE_ID" >&2; exit 1 ;;
          esac
          cp "$RUNNER_TEMP/stroy-app-store.mobileprovision" "$PROFILE_DIR/$PROFILE_UUID.mobileprovision"
          echo "STROY_IOS_PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "STROY_IOS_PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze application
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Prepare iOS release build
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://api.stroy.com.kg --dart-define=OFFLINE_DEMO=false

      - name: Create signed App Store archive
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/STROY.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$STROY_IOS_SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="$STROY_IOS_TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$STROY_IOS_PROFILE_NAME" \
            PRODUCT_BUNDLE_IDENTIFIER="$STROY_IOS_BUNDLE_ID"

      - name: Export signed IPA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              "method": "app-store",
              "signingStyle": "manual",
              "teamID": os.environ["STROY_IOS_TEAM_ID"],
              "provisioningProfiles": {
                  os.environ["STROY_IOS_BUNDLE_ID"]: os.environ["STROY_IOS_PROFILE_NAME"]
              },
              "stripSwiftSymbols": True,
              "uploadSymbols": True,
          }
          Path(os.environ["RUNNER_TEMP"], "stroy-export-options.plist").write_bytes(
              plistlib.dumps(options)
          )
          PY
          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/STROY.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/stroy-export-options.plist" \
            -exportPath "$RUNNER_TEMP/stroy-ipa"
          IPA_PATH="$(find "$RUNNER_TEMP/stroy-ipa" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          test -s "$IPA_PATH"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v4
        with:
          name: stroy-production-ios-ipa-${{ github.run_number }}
          path: ${{ runner.temp }}/stroy-ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing materials
        if: always()
        run: |
          security delete-keychain "$STROY_KEYCHAIN_PATH" || true
          if [ -n "${STROY_IOS_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$STROY_IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/stroy-distribution.p12" \
            "$RUNNER_TEMP/stroy-app-store.mobileprovision" \
            "$RUNNER_TEMP/stroy-profile.plist" \
            "$RUNNER_TEMP/stroy-export-options.plist"
