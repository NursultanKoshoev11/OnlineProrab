name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: write

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Clean obsolete UI code and format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          form = Path('lib/app/redesign/cost_project_form.dart')
          text = form.read_text()
          old = """      final result = await FilePicker.pickFiles(
                type: FileType.image,
                allowMultiple: false,
                withData: false,
              );
              if (!mounted || result == null || result.isEmpty) return;
              final selected = result.single;
          """
          if old not in text:
              old = """      final result = await FilePicker.pickFiles(
                type: FileType.image,
                allowMultiple: false,
                withData: false,
              );
              if (!mounted || result == null || result.isEmpty) return;
              final selected = result.single;
          """
          text = text.replace(old, """      final selected = await FilePicker.pickFile(type: FileType.image);
              if (!mounted || selected == null) return;
          """)
          form.write_text(text)

          helpers = Path('lib/app/redesign/helpers.dart')
          text = helpers.read_text()
          start = text.find('String _categoryLabel(')
          end = text.find('String _roleLabel(')
          if start >= 0 and end > start:
              text = text[:start] + text[end:]
          helpers.write_text(text)

          widgets = Path('lib/app/redesign/widgets.dart')
          text = widgets.read_text()
          start = text.find('class _FilterChip')
          end = text.find('class _StatusPill')
          if start >= 0 and end > start:
              text = text[:start] + text[end:]
          widgets.write_text(text)
          PY
          dart format lib test

      - name: Commit cleanup when needed
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Clean simplified project and expense UI"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Analyze application
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8080

      - name: Build release APK compile check
        run: flutter build apk --release --dart-define=API_BASE_URL=http://127.0.0.1:8080
