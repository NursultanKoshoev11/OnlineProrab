name: Mobile CI

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API URL for the test APK'
        required: true
        default: 'http://127.0.0.1:8080'
        type: string
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze application
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'http://127.0.0.1:8080' }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: online-prorab-debug-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK compile check
        env:
          API_BASE_URL: ${{ inputs.api_base_url || 'http://127.0.0.1:8080' }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
