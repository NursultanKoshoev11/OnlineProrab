name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: write

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Update single-image picker and format
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          form = Path('lib/app/redesign/cost_project_form.dart')
          text = form.read_text()
          pattern = re.compile(
              r"      final result = await FilePicker\.pickFiles\(\n"
              r"        type: FileType\.image,\n"
              r"        allowMultiple: false,\n"
              r"        withData: false,\n"
              r"      \);\n"
              r"      if \(!mounted \|\| result == null \|\| result\.isEmpty\) return;\n"
              r"      final selected = result\.single;"
          )
          replacement = (
              "      final selected = await FilePicker.pickFile(type: FileType.image);\n"
              "      if (!mounted || selected == null) return;"
          )
          text, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f'Expected one file-picker block, replaced {count}')
          form.write_text(text)
          PY
          dart format lib test

      - name: Commit picker cleanup when needed
        shell: bash
        run: |
          if git diff --quiet -- lib test; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test
          git commit -m "Use current single-file picker API"
          git reset --hard HEAD
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Analyze application
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8080

      - name: Build release APK compile check
        run: flutter build apk --release --dart-define=API_BASE_URL=http://127.0.0.1:8080
