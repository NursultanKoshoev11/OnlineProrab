name: Mobile CI

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API URL for the test APK'
        required: true
        default: 'http://127.0.0.1:8080'
        type: string
      offline_demo:
        description: 'Run the APK with built-in demo data and no server'
        required: true
        default: 'true'
        type: string
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          - name: offline
            api_base_url: http://127.0.0.1:8080
            offline_demo: 'true'
          - name: online
            api_base_url: http://16.171.171.191
            offline_demo: 'false'
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Generate adaptive STROY launcher icons
        run: dart run flutter_launcher_icons

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Analyze application
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        env:
          API_BASE_URL: ${{ matrix.build.api_base_url }}
          OFFLINE_DEMO: ${{ matrix.build.offline_demo }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=OFFLINE_DEMO="$OFFLINE_DEMO"

      - name: Name debug APK for STROY
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/stroy-${{ matrix.build.name }}-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stroy-${{ matrix.build.name }}-debug-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/stroy-${{ matrix.build.name }}-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release APK compile check
        env:
          API_BASE_URL: ${{ matrix.build.api_base_url }}
          OFFLINE_DEMO: ${{ matrix.build.offline_demo }}
        run: flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL" --dart-define=OFFLINE_DEMO="$OFFLINE_DEMO"

      - name: Name release APK for STROY
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/stroy-${{ matrix.build.name }}-release.apk

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stroy-${{ matrix.build.name }}-release-apk-${{ github.run_number }}
          path: mobile/build/app/outputs/flutter-apk/stroy-${{ matrix.build.name }}-release.apk
          if-no-files-found: error
          retention-days: 14
