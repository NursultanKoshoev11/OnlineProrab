name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'

permissions:
  contents: write

jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply one-time Flutter compatibility fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          fixes = {
              Path('lib/app/backend_app_v3.dart'): [
                  ('Colors.white.withOpacity(.9)', 'Colors.white.withValues(alpha: .9)', 1),
              ],
              Path('lib/app/backend_project_dashboard_v3.dart'): [
                  ('FilePicker.platform.pickFiles(', 'FilePicker.pickFiles(', 1),
              ],
              Path('lib/app/project_team_screen.dart'): [
                  ('value: role,', 'initialValue: role,', 2),
              ],
              Path('test/api_client_test.dart'): [
                  ("import 'dart:async';\n\n", '', 1),
              ],
          }

          changed = False
          for path, replacements in fixes.items():
              text = path.read_text(encoding='utf-8')
              for old, new, expected in replacements:
                  old_count = text.count(old)
                  new_count = text.count(new)
                  if old_count == expected:
                      text = text.replace(old, new)
                      changed = True
                  elif old_count == 0 and new_count >= expected:
                      pass
                  else:
                      raise SystemExit(
                          f'{path}: unexpected replacement state for {old!r}: '
                          f'old={old_count}, new={new_count}, expected={expected}'
                      )
              path.write_text(text, encoding='utf-8')

          print('compatibility_changes=', changed)
          PY
          git diff --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/app/backend_app_v3.dart lib/app/backend_project_dashboard_v3.dart lib/app/project_team_screen.dart test/api_client_test.dart
            git commit -m "Fix Flutter 3.47 UI compatibility issues"
            git push origin HEAD:main
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format active application
        run: >-
          dart format
          lib/main.dart
          lib/app/backend_app_v3.dart
          lib/app/backend_project_dashboard_v3.dart
          lib/app/project_team_screen.dart
          lib/app/online_prorab_theme.dart
          test/widget_test.dart

      - name: Analyze active application
        run: >-
          flutter analyze
          lib/main.dart
          lib/app/backend_app_v3.dart
          lib/app/backend_project_dashboard_v3.dart
          lib/app/project_team_screen.dart
          lib/app/online_prorab_theme.dart

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8080

      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=https://api.example.invalid
