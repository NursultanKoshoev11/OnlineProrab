name: Backup Restore Verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/scripts/backup.sh'
      - 'backend/scripts/restore.sh'
      - 'backend/scripts/apply-deletion-tombstones.py'
      - 'backend/scripts/test_apply_deletion_tombstones.py'
      - 'backend/scripts/safe-path.sh'
      - 'deploy/aws/onlineprorab-storage.yaml'
      - '.github/workflows/backup-restore.yml'
  pull_request:
    paths:
      - 'backend/scripts/backup.sh'
      - 'backend/scripts/restore.sh'
      - 'backend/scripts/apply-deletion-tombstones.py'
      - 'backend/scripts/test_apply_deletion_tombstones.py'
      - 'backend/scripts/safe-path.sh'
      - 'deploy/aws/onlineprorab-storage.yaml'
      - '.github/workflows/backup-restore.yml'

permissions:
  contents: read

jobs:
  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onlineprorab_backup_test
          POSTGRES_USER: onlineprorab
          POSTGRES_PASSWORD: onlineprorab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onlineprorab -d onlineprorab_backup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://onlineprorab:onlineprorab@127.0.0.1:5432/onlineprorab_backup_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client age

      - name: Create ephemeral age keypair for S3 backup verification
        run: |
          age-keygen -o "$RUNNER_TEMP/backup-age-identity.txt"
          age-keygen -y "$RUNNER_TEMP/backup-age-identity.txt" > "$RUNNER_TEMP/backup-age-recipients.txt"
          age-keygen -o "$RUNNER_TEMP/unrelated-age-identity.txt"
          chmod 600 "$RUNNER_TEMP/backup-age-identity.txt"
          chmod 600 "$RUNNER_TEMP/unrelated-age-identity.txt"

      - name: Validate deletion journal replay
        run: python3 -m unittest scripts/test_apply_deletion_tombstones.py

      - name: Reject unsafe backup and restore paths
        run: |
          set -eu
          if UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-uploads" BACKUP_DIR=/ sh scripts/backup.sh >/dev/null 2>&1; then
            echo "backup unexpectedly accepted BACKUP_DIR=/" >&2
            exit 1
          fi
          if UPLOAD_DIR=/ BACKUP_DIR="$RUNNER_TEMP/onlineprorab-backups" sh scripts/backup.sh >/dev/null 2>&1; then
            echo "backup unexpectedly accepted UPLOAD_DIR=/" >&2
            exit 1
          fi
          ln -s / "$RUNNER_TEMP/root-backup-link"
          if UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-uploads" BACKUP_DIR="$RUNNER_TEMP/root-backup-link" sh scripts/backup.sh >/dev/null 2>&1; then
            echo "backup unexpectedly accepted a symlink to /" >&2
            exit 1
          fi
          if UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-uploads" BACKUP_DIR="$RUNNER_TEMP/root-backup-link/backups" sh scripts/backup.sh >/dev/null 2>&1; then
            echo "backup unexpectedly accepted a symlink in its parent path" >&2
            exit 1
          fi
          if CONFIRM_RESTORE=YES UPLOAD_DIR=/ sh scripts/restore.sh "$RUNNER_TEMP/missing-backup" >/dev/null 2>&1; then
            echo "restore unexpectedly accepted UPLOAD_DIR=/" >&2
            exit 1
          fi
          ln -s / "$RUNNER_TEMP/root-upload-link"
          if CONFIRM_RESTORE=YES UPLOAD_DIR="$RUNNER_TEMP/root-upload-link" sh scripts/restore.sh "$RUNNER_TEMP/missing-backup" >/dev/null 2>&1; then
            echo "restore unexpectedly accepted a symlink to /" >&2
            exit 1
          fi
          if CONFIRM_RESTORE=YES UPLOAD_DIR="$RUNNER_TEMP/root-upload-link/uploads" sh scripts/restore.sh "$RUNNER_TEMP/missing-backup" >/dev/null 2>&1; then
            echo "restore unexpectedly accepted a symlink in its parent path" >&2
            exit 1
          fi

      - name: Seed database and uploads
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE backup_probe (id integer PRIMARY KEY, value text NOT NULL);
          INSERT INTO backup_probe (id, value) VALUES (1, 'backup-ok');
          SQL
          mkdir -p "$RUNNER_TEMP/onlineprorab-uploads/nested"
          printf '%s' 'receipt-content' > "$RUNNER_TEMP/onlineprorab-uploads/nested/receipt.txt"
          long_name="$(printf '%120s' '' | tr ' ' x)"
          printf '%s' 'long-name-content' > "$RUNNER_TEMP/onlineprorab-uploads/$long_name"

      - name: Create backup
        run: |
          BACKUP_DIR="$RUNNER_TEMP/onlineprorab-backups" \
          UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-uploads" \
          RETENTION_DAYS=14 \
          sh scripts/backup.sh > "$RUNNER_TEMP/backup-path.txt"
          test -s "$RUNNER_TEMP/backup-path.txt"

      - name: Destroy source data
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'DROP TABLE backup_probe;'
          rm -rf "$RUNNER_TEMP/onlineprorab-uploads"
          mkdir -p "$RUNNER_TEMP/onlineprorab-uploads"

      - name: Restore backup
        run: |
          backup_dir="$(cat "$RUNNER_TEMP/backup-path.txt")"
          CONFIRM_RESTORE=YES \
          UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-uploads" \
          sh scripts/restore.sh "$backup_dir"

      - name: Verify restored database and file
        run: |
          test "$(psql "$DATABASE_URL" -Atc 'SELECT value FROM backup_probe WHERE id = 1')" = 'backup-ok'
          test "$(cat "$RUNNER_TEMP/onlineprorab-uploads/nested/receipt.txt")" = 'receipt-content'
          long_name="$(printf '%120s' '' | tr ' ' x)"
          test "$(cat "$RUNNER_TEMP/onlineprorab-uploads/$long_name")" = 'long-name-content'

      - name: Prepare isolated S3 test bucket and CLI stub
        run: |
          mkdir -p "$RUNNER_TEMP/fake-aws-bin" "$RUNNER_TEMP/fake-s3-bucket/project/nested" "$RUNNER_TEMP/fake-s3-ledger/tombstones/accounts" "$RUNNER_TEMP/fake-s3-ledger/tombstones/objects" "$RUNNER_TEMP/fake-s3-archive"
          cat > "$RUNNER_TEMP/fake-aws-bin/aws" <<'SH'
          #!/bin/sh
          set -eu
          if [ "$#" -eq 10 ] && [ "$1" = "--region" ] && [ "$3" = "s3api" ] && [ "$4" = "delete-objects" ]; then
            if [ "$5" != "--bucket" ] || [ "$6" != "$S3_BUCKET" ] || [ "$7" != "--delete" ] || [ "$9" != "--output" ] || [ "${10}" != "json" ]; then
              echo "restore must delete tombstoned keys from the exact target bucket" >&2
              exit 2
            fi
            python3 - "${8#file://}" "$FAKE_S3_BUCKET_DIR" <<'PY'
          import json
          import sys
          from pathlib import Path

          with open(sys.argv[1], encoding="utf-8") as manifest_file:
              manifest = json.load(manifest_file)
          root = Path(sys.argv[2]).resolve()
          for item in manifest["Objects"]:
              target = (root / item["Key"]).resolve()
              if not target.is_relative_to(root):
                  raise SystemExit("unsafe deletion key")
              target.unlink(missing_ok=True)
          PY
            printf '%s' '{"Deleted":[]}'
            exit 0
          fi
          if [ "$#" -eq 7 ] && [ "$1" = "--region" ] && [ "$3" = "s3" ] && [ "$4" = "cp" ]; then
            source="$5"
            destination="$6"
            case "$source" in
              "s3://$S3_BACKUP_BUCKET/snapshots/"*)
                object_path="${source#s3://$S3_BACKUP_BUCKET/}"
                mkdir -p "$(dirname "$destination")"
                cp "$FAKE_S3_ARCHIVE_DIR/$object_path" "$destination"
                ;;
              *)
                case "$destination" in
                  "s3://$S3_BACKUP_BUCKET/snapshots/"*)
                    object_path="${destination#s3://$S3_BACKUP_BUCKET/}"
                    mkdir -p "$(dirname "$FAKE_S3_ARCHIVE_DIR/$object_path")"
                    cp "$source" "$FAKE_S3_ARCHIVE_DIR/$object_path"
                    ;;
                  *) echo "unexpected S3 copy path" >&2; exit 2 ;;
                esac
                ;;
            esac
            exit 0
          fi
          if [ "$#" -lt 7 ] || [ "$1" != "--region" ] || [ "$3" != "s3" ] || [ "$4" != "sync" ]; then
            echo "unexpected AWS CLI arguments" >&2
            exit 2
          fi
          source="$5"
          destination="$6"
          case "$source" in
            "s3://$S3_BACKUP_BUCKET/snapshots/"*)
              snapshot_path="${source#s3://$S3_BACKUP_BUCKET/}"
              mkdir -p "$destination"
              cp -a "$FAKE_S3_ARCHIVE_DIR/$snapshot_path". "$destination"/
              ;;
            "s3://$S3_BUCKET")
              mkdir -p "$destination"
              cp -a "$FAKE_S3_BUCKET_DIR"/. "$destination"/
              ;;
            "s3://$S3_DELETION_LEDGER_BUCKET/tombstones/")
              mkdir -p "$destination"
              cp -a "$FAKE_S3_LEDGER_DIR"/. "$destination"/
              ;;
            *)
              case "$destination" in
                "s3://$S3_BACKUP_BUCKET/snapshots/"*)
                  snapshot_path="${destination#s3://$S3_BACKUP_BUCKET/}"
                  mkdir -p "$FAKE_S3_ARCHIVE_DIR/$snapshot_path"
                  cp -a "$source"/. "$FAKE_S3_ARCHIVE_DIR/$snapshot_path".
                  ;;
                "s3://$S3_BUCKET")
                  if [ "$7" != "--delete" ]; then
                    echo "restore must replace the exact test bucket" >&2
                    exit 2
                  fi
                  rm -rf "$FAKE_S3_BUCKET_DIR"
                  mkdir -p "$FAKE_S3_BUCKET_DIR"
                  cp -a "$source"/. "$FAKE_S3_BUCKET_DIR"/
                  ;;
                *) echo "unexpected S3 destination" >&2; exit 2 ;;
              esac
              ;;
          esac
          SH
          chmod +x "$RUNNER_TEMP/fake-aws-bin/aws"
          printf '%s' 's3-object-before-backup' > "$RUNNER_TEMP/fake-s3-bucket/project/nested/object.bin"
          printf '%s' 'deleted-object-after-snapshot' > "$RUNNER_TEMP/fake-s3-bucket/project/nested/deleted-after-snapshot.bin"

      - name: Create S3-backed database and object backup
        run: |
          export PATH="$RUNNER_TEMP/fake-aws-bin:$PATH"
          export FAKE_S3_BUCKET_DIR="$RUNNER_TEMP/fake-s3-bucket"
          export FAKE_S3_LEDGER_DIR="$RUNNER_TEMP/fake-s3-ledger/tombstones"
          export BACKUP_AGE_RECIPIENTS_FILE="$RUNNER_TEMP/backup-age-recipients.txt"
          export FAKE_S3_ARCHIVE_DIR="$RUNNER_TEMP/fake-s3-archive"
          export APP_ENV=production STORAGE_DRIVER=s3 S3_REGION=us-east-1 S3_BUCKET=onlineprorab-ci-test S3_DELETION_LEDGER_BUCKET=onlineprorab-ci-ledger S3_BACKUP_BUCKET=onlineprorab-ci-backups
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE s3_backup_probe (id integer PRIMARY KEY, value text NOT NULL);
          INSERT INTO s3_backup_probe (id, value) VALUES (1, 's3-backup-ok');
          CREATE TABLE users (id uuid PRIMARY KEY);
          CREATE TABLE files (storage_path text PRIMARY KEY);
          INSERT INTO users (id) VALUES ('7cbcf034-8122-4d2d-92fd-f704dcdf8752');
          INSERT INTO files (storage_path) VALUES ('project/nested/deleted-after-snapshot.bin');
          SQL
          BACKUP_DIR="$RUNNER_TEMP/onlineprorab-s3-backups" \
          UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-s3-uploads" \
          RETENTION_DAYS=14 \
          sh scripts/backup.sh > "$RUNNER_TEMP/s3-backup-path.txt"
          test -s "$RUNNER_TEMP/s3-backup-path.txt"
          backup_uri="$(cat "$RUNNER_TEMP/s3-backup-path.txt")"
          archive_dir="$FAKE_S3_ARCHIVE_DIR/${backup_uri#s3://$S3_BACKUP_BUCKET/}"
          test -s "$archive_dir/snapshot.tar.age"
          test -s "$archive_dir/MANIFEST"
          test ! -e "$archive_dir/database.dump"
          test ! -e "$archive_dir/uploads.tar.gz"

      - name: Destroy S3-backed source data
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE s3_backup_probe;
          DELETE FROM users;
          DELETE FROM files;
          SQL
          user_id=7cbcf034-8122-4d2d-92fd-f704dcdf8752
          storage_path=project/nested/deleted-after-snapshot.bin
          object_digest="$(printf '%s' "$storage_path" | sha256sum | cut -d ' ' -f 1)"
          printf '{"version":1,"kind":"account","user_id":"%s","created_at_utc":"2026-10-14T00:00:00Z"}\n' "$user_id" > "$RUNNER_TEMP/fake-s3-ledger/tombstones/accounts/$user_id.json"
          printf '{"version":1,"kind":"object","storage_path":"%s","created_at_utc":"2026-10-14T00:00:00Z"}\n' "$storage_path" > "$RUNNER_TEMP/fake-s3-ledger/tombstones/objects/$object_digest.json"
          rm -rf "$RUNNER_TEMP/fake-s3-bucket"
          mkdir -p "$RUNNER_TEMP/fake-s3-bucket/extra"
          printf '%s' 'object-that-must-be-removed' > "$RUNNER_TEMP/fake-s3-bucket/extra/stale.bin"

      - name: Restore S3-backed database and objects
        run: |
          export PATH="$RUNNER_TEMP/fake-aws-bin:$PATH"
          export FAKE_S3_BUCKET_DIR="$RUNNER_TEMP/fake-s3-bucket"
          export FAKE_S3_LEDGER_DIR="$RUNNER_TEMP/fake-s3-ledger/tombstones"
          export FAKE_S3_ARCHIVE_DIR="$RUNNER_TEMP/fake-s3-archive"
          export BACKUP_AGE_IDENTITY_FILE="$RUNNER_TEMP/backup-age-identity.txt"
          export APP_ENV=production STORAGE_DRIVER=s3 S3_REGION=us-east-1 S3_BUCKET=onlineprorab-ci-test S3_DELETION_LEDGER_BUCKET=onlineprorab-ci-ledger S3_BACKUP_BUCKET=onlineprorab-ci-backups CONFIRM_RESTORE=YES CONFIRM_S3_TARGET_BUCKET=onlineprorab-ci-test
          backup_uri="$(cat "$RUNNER_TEMP/s3-backup-path.txt")"
          if env -u CONFIRM_S3_TARGET_BUCKET UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-s3-uploads" sh scripts/restore.sh "$backup_uri" >/dev/null 2>&1; then
            echo "restore unexpectedly accepted a missing S3 target confirmation" >&2
            exit 1
          fi
          if CONFIRM_S3_TARGET_BUCKET=unintended-bucket UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-s3-uploads" sh scripts/restore.sh "$backup_uri" >/dev/null 2>&1; then
            echo "restore unexpectedly accepted a mismatched S3 target confirmation" >&2
            exit 1
          fi
          if UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-s3-uploads" sh scripts/restore.sh "${backup_uri/onlineprorab-ci-backups/untrusted-backups}" >/dev/null 2>&1; then
            echo "restore unexpectedly accepted an unconfigured backup bucket" >&2
            exit 1
          fi
          if UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-s3-uploads" sh scripts/restore.sh "s3://$S3_BACKUP_BUCKET/snapshots/../outside/" >/dev/null 2>&1; then
            echo "restore unexpectedly accepted an unsafe backup object prefix" >&2
            exit 1
          fi
          if BACKUP_AGE_IDENTITY_FILE="$RUNNER_TEMP/unrelated-age-identity.txt" UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-s3-uploads" sh scripts/restore.sh "$backup_uri" >/dev/null 2>&1; then
            echo "restore unexpectedly accepted an unrelated age identity" >&2
            exit 1
          fi
          legacy_backup_dir="$(cat "$RUNNER_TEMP/backup-path.txt")"
          if BACKUP_AGE_IDENTITY_FILE="$RUNNER_TEMP/backup-age-identity.txt" UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-s3-uploads" sh scripts/restore.sh "$legacy_backup_dir" >/dev/null 2>&1; then
            echo "restore unexpectedly accepted an unencrypted S3 backup without explicit approval" >&2
            exit 1
          fi
          UPLOAD_DIR="$RUNNER_TEMP/onlineprorab-s3-uploads" sh scripts/restore.sh "$backup_uri"

      - name: Verify S3-backed restore
        run: |
          test "$(psql "$DATABASE_URL" -Atc 'SELECT value FROM s3_backup_probe WHERE id = 1')" = 's3-backup-ok'
          test "$(cat "$RUNNER_TEMP/fake-s3-bucket/project/nested/object.bin")" = 's3-object-before-backup'
          test ! -e "$RUNNER_TEMP/fake-s3-bucket/extra/stale.bin"
          test "$(psql "$DATABASE_URL" -Atc 'SELECT COUNT(*) FROM users')" = '0'
          test "$(psql "$DATABASE_URL" -Atc 'SELECT COUNT(*) FROM files')" = '0'
          test ! -e "$RUNNER_TEMP/fake-s3-bucket/project/nested/deleted-after-snapshot.bin"
          if find "$RUNNER_TEMP" -maxdepth 1 -name '.onlineprorab-restore-data.*' -print -quit | grep -q .; then
            echo "restore left decrypted data in its private staging directory" >&2
            exit 1
          fi
          if find "$RUNNER_TEMP" -maxdepth 1 -name '.onlineprorab-backup-download.*' -print -quit | grep -q .; then
            echo "restore left its downloaded backup staging directory" >&2
            exit 1
          fi
