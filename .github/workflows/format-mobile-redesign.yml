name: Format mobile redesign

on:
  push:
    branches: [main]
    paths:
      - 'mobile/lib/app/online_prorab_redesign.dart'
      - 'mobile/lib/app/redesign/**'
      - '.github/workflows/format-mobile-redesign.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format redesign
        run: dart format mobile/lib/main.dart mobile/lib/app/online_prorab_redesign.dart mobile/lib/app/redesign

      - name: Remove temporary formatter workflow
        run: rm .github/workflows/format-mobile-redesign.yml

      - name: Commit formatted sources
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/main.dart mobile/lib/app/online_prorab_redesign.dart mobile/lib/app/redesign .github/workflows/format-mobile-redesign.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format OnlineProrab mobile redesign"
          git push
