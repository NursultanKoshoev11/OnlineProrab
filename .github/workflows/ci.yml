name: CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onlineprorab
          POSTGRES_USER: onlineprorab
          POSTGRES_PASSWORD: onlineprorab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onlineprorab -d onlineprorab"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://onlineprorab:onlineprorab@localhost:5432/onlineprorab?sslmode=disable
      TEST_DATABASE_URL: postgres://onlineprorab:onlineprorab@localhost:5432/onlineprorab?sslmode=disable
      JWT_SECRET: ci-only-secret
      ACCESS_TOKEN_TTL_MINUTES: 15
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      MAX_UPLOAD_MB: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify staging Compose fails closed
        working-directory: .
        env:
          APP_ENV: production
          DATABASE_URL: postgres://staging:staging@db.example.com:5432/staging?sslmode=verify-full
          JWT_SECRET: ci-only-secret
          CORS_ALLOWED_ORIGINS: https://staging.example.com
          TRUSTED_PROXY_CIDRS: 10.20.0.4/32
          SMS_PROVIDER: nikita
          DEV_SMS_CODE_ENABLED: "true"
          REVIEW_ONLY_MODE: "true"
          NIKITA_API_URL: https://attacker.invalid
          NIKITA_TEST_MODE: "true"
          STAGING_POSTGRES_USER: staging-ci
          STAGING_POSTGRES_PASSWORD: staging-ci-secret
          STORAGE_DRIVER: local
          S3_REGION: us-east-1
          S3_BUCKET: staging-ci
          S3_DELETION_LEDGER_BUCKET: staging-deletion-ledger-ci
          AWS_ACCESS_KEY_ID: ci-access-key
          AWS_SECRET_ACCESS_KEY: ci-secret-key
          AWS_SESSION_TOKEN: ci-session-token
          S3_ENDPOINT: http://attacker.invalid
          S3_FORCE_PATH_STYLE: "true"
        run: |
          docker compose -f deploy/docker-compose.staging.yml config --format json > "$RUNNER_TEMP/staging-compose.json"
          python3 - "$RUNNER_TEMP/staging-compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as config_file:
              service = json.load(config_file)["services"]["api"]
          environment = service["environment"]
          assert environment["APP_ENV"] == "staging"
          assert "sslmode=verify-full" in environment["DATABASE_URL"]
          assert environment["TRUSTED_PROXY_CIDRS"] == "10.20.0.4/32"
          assert environment["SMS_PROVIDER"] == "nikita"
          assert environment["DEV_SMS_CODE_ENABLED"] == "false"
          assert environment["REVIEW_ONLY_MODE"] == "false"
          assert environment["NIKITA_TEST_MODE"] == "false"
          assert environment["NIKITA_API_URL"] == "https://smspro.nikita.kg/api/message"
          assert environment["STORAGE_DRIVER"] == "s3"
          assert environment["S3_REGION"] == "us-east-1"
          assert environment["S3_BUCKET"] == "staging-ci"
          assert environment["S3_DELETION_LEDGER_BUCKET"] == "staging-deletion-ledger-ci"
          assert environment["AWS_ACCESS_KEY_ID"] == "ci-access-key"
          assert environment["AWS_SECRET_ACCESS_KEY"] == "ci-secret-key"
          assert environment["AWS_SESSION_TOKEN"] == "ci-session-token"
          assert "S3_ENDPOINT" not in environment
          assert "S3_FORCE_PATH_STYLE" not in environment
          assert not environment.get("REVIEW_SMS_PHONE")
          assert not environment.get("REVIEW_SMS_CODE")
          PY

          for required in DATABASE_URL CORS_ALLOWED_ORIGINS TRUSTED_PROXY_CIDRS STAGING_POSTGRES_USER STAGING_POSTGRES_PASSWORD S3_REGION S3_BUCKET S3_DELETION_LEDGER_BUCKET; do
            if env -u "$required" docker compose -f deploy/docker-compose.staging.yml config >/dev/null 2>&1; then
              echo "staging Compose unexpectedly rendered without $required" >&2
              exit 1
            fi
          done

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Race tests
        run: go test -race ./...

      - name: Build API
        run: go build ./cmd/api

      - name: Smoke build startup
        run: timeout 10s go run ./cmd/api || test $? -eq 124

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify Google Play target API requirement
        run: python3 tool/validate_android_target_sdk.py --minimum 36

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Prepare Android platform
        run: python3 tool/prepare_android.py

      - name: Install and verify Android NDK
        run: python3 tool/install_android_ndk.py

      - name: Get dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze lib test

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://127.0.0.1:8080

  website:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit website build dependencies
        run: npm audit --audit-level=high

      - name: Test account deletion flow
        run: npm test

      - name: Check formatting and JavaScript syntax
        run: npm run check

      - name: Build website assets
        run: npm run build

      - name: Check deployment script syntax
        run: bash -n deploy-remote.sh deploy-billing-remote.sh

      - name: Test deployment path, archive, and rollback guards
        run: bash deploy-remote.test.sh

      - name: Verify Compose logging configuration
        run: |
          docker compose config --format json | python3 -c 'import json,sys; service=json.load(sys.stdin)["services"]["stroy-website"]; assert service["logging"] == {"driver":"json-file","options":{"max-size":"10m","max-file":"5"}}, service'

      - name: Verify billing Compose configuration
        run: docker compose -f docker-compose.billing.yml config --quiet

      - name: Build website container
        run: |
          docker build --pull \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag stroy-website:production .
          test "$(docker image inspect --format '{{.Config.User}}' stroy-website:production)" = '101:101'
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' stroy-website:production)" = "$GITHUB_SHA"

      - name: Smoke-test website container
        shell: bash
        run: |
          set -euo pipefail
          container_name="stroy-website-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          host_port=18081
          page_file="$(mktemp)"
          headers_file="$(mktemp)"
          homepage_file="$(mktemp)"
          homepage_headers_file="$(mktemp)"
          cleanup() {
            docker stop "$container_name" >/dev/null 2>&1 || true
            rm -f "$page_file" "$headers_file" "$homepage_file" "$homepage_headers_file"
          }
          trap cleanup EXIT

          docker run --detach --rm --name "$container_name" \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            --publish "127.0.0.1:${host_port}:80" stroy-website:production >/dev/null

          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent \
              --dump-header "$headers_file" \
              --output "$page_file" \
              "http://127.0.0.1:${host_port}/account-deletion/"; then
              ready=1
              break
            fi
            sleep 0.25
          done

          if [[ "$ready" != 1 ]]; then
            echo "website container did not serve the account deletion page" >&2
            exit 1
          fi
          grep -Fq '<title>Удаление аккаунта — STROY</title>' "$page_file"

          curl --fail --silent --show-error \
            --dump-header "$homepage_headers_file" \
            --output "$homepage_file" \
            "http://127.0.0.1:${host_port}/"
          grep -Fq '<title>STROY — стройте больше. Управляйте проще.</title>' "$homepage_file"

          for path in /api /api/health; do
            api_status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              "http://127.0.0.1:${host_port}${path}")"
            if [[ "$api_status" != "404" ]]; then
              echo "website must reject API path ${path}; got HTTP ${api_status}" >&2
              exit 1
            fi
          done

          python3 - "$headers_file" "$homepage_headers_file" <<'PY'
          import pathlib
          import sys

          required = {
              "content-security-policy",
              "permissions-policy",
              "strict-transport-security",
              "x-content-type-options",
              "x-frame-options",
              "referrer-policy",
          }
          for path in sys.argv[1:]:
              headers = pathlib.Path(path).read_text(encoding="utf-8").lower()
              present = {line.split(":", 1)[0] for line in headers.splitlines() if ":" in line}
              missing = required - present
              assert not missing, f"{path} is missing headers: {sorted(missing)}"
          PY

      - name: Build the billing container
        run: |
          docker build --pull \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag stroy-obank-billing:production \
            --file Dockerfile.billing .
          test "$(docker image inspect --format '{{.Config.User}}' stroy-obank-billing:production)" = '101:101'
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' stroy-obank-billing:production)" = "$GITHUB_SHA"

      - name: Smoke-test billing container
        shell: bash
        run: |
          set -euo pipefail
          container_name="stroy-billing-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          host_port=18082
          page_file="$(mktemp)"
          script_file="$(mktemp)"
          cleanup() {
            docker stop "$container_name" >/dev/null 2>&1 || true
            rm -f "$page_file" "$script_file"
          }
          trap cleanup EXIT

          docker run --detach --rm --name "$container_name" \
            --read-only \
            --tmpfs /tmp:size=64m,mode=1777 \
            --tmpfs /var/cache/nginx:size=64m,uid=101,gid=101,mode=0700 \
            --tmpfs /run:size=16m,uid=101,gid=101,mode=0700 \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges:true \
            --publish "127.0.0.1:${host_port}:80" stroy-obank-billing:production >/dev/null

          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent \
              --output "$page_file" \
              "http://127.0.0.1:${host_port}/billing/"; then
              ready=1
              break
            fi
            sleep 0.25
          done

          if [[ "$ready" != 1 ]]; then
            echo "billing container did not serve its account page" >&2
            exit 1
          fi
          grep -Fq '<title>Вход и подписка — STROY</title>' "$page_file"
          curl --fail --silent --show-error \
            --output "$script_file" \
            "http://127.0.0.1:${host_port}/billing/billing.js"
          grep -Fq 'sandbox_test_mode' "$script_file"

      - name: Save the CI-tested website image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: docker save stroy-website:production stroy-obank-billing:production | gzip -1 > "$RUNNER_TEMP/stroy-website-${GITHUB_SHA}.image.tar.gz"

      - name: Upload the CI-tested website image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-website-image-${{ github.sha }}
          path: ${{ runner.temp }}/stroy-website-${{ github.sha }}.image.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
