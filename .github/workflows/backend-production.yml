name: Backend Production Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/aws/**'
      - '.github/workflows/backend-production.yml'
      - '.github/workflows/backend-production-deploy.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'deploy/aws/**'
      - '.github/workflows/backend-production.yml'
      - '.github/workflows/backend-production-deploy.yml'

permissions:
  contents: read

jobs:
  backend-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: onlineprorab_test
          POSTGRES_USER: onlineprorab
          POSTGRES_PASSWORD: onlineprorab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U onlineprorab -d onlineprorab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://onlineprorab:onlineprorab@127.0.0.1:5432/onlineprorab_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check deployment workflow and remote script syntax
        working-directory: .
        run: |
          ruby -e 'require "yaml"; YAML.load_file(ARGV.fetch(0))' .github/workflows/backend-production-deploy.yml
          bash -n backend/deploy-remote.sh backend/deploy-remote.test.sh
          bash backend/deploy-remote.test.sh

      - name: Validate production Compose configuration
        working-directory: .
        env:
          API_IMAGE: stroy-api:production-config-check
          DATABASE_URL: postgres://onlineprorab:ci-only@db.example.invalid:5432/onlineprorab?sslmode=verify-full
          JWT_SECRET: ci-only-secret
          CORS_ALLOWED_ORIGINS: https://stroy.com.kg
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          STORAGE_DRIVER: s3
          S3_REGION: us-east-1
          S3_BUCKET: onlineprorab-ci-uploads
          S3_DELETION_LEDGER_BUCKET: onlineprorab-ci-deletions
          API_LOG_GROUP: /onlineprorab/production/api
          SMS_PROVIDER: twilio
        run: |
          set -euo pipefail
          if env -u API_LOG_GROUP docker compose -f backend/docker-compose.prod.yml config --quiet >/dev/null 2>&1; then
            echo "production Compose unexpectedly accepted a missing API_LOG_GROUP" >&2
            exit 1
          fi
          resolved_config="$(docker compose -f backend/docker-compose.prod.yml config)"
          printf '%s\n' "$resolved_config" | grep -F 'driver: awslogs' >/dev/null
          printf '%s\n' "$resolved_config" | grep -F "awslogs-group: $API_LOG_GROUP" >/dev/null
          printf '%s\n' "$resolved_config" | grep -F 'awslogs-create-group: "false"' >/dev/null
          printf '%s\n' "$resolved_config" | grep -F 'mode: non-blocking' >/dev/null
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Scan for Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Format check
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Race tests
        run: go test -race ./...
      - name: Build API entry points
        run: go build ./cmd/api ./cmd/prodapi

  infrastructure-checks:
    name: AWS infrastructure templates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cfn-lint
        run: |
          python3 -m venv "$RUNNER_TEMP/cfn-lint"
          "$RUNNER_TEMP/cfn-lint/bin/python" -m pip install --disable-pip-version-check --no-input cfn-lint==1.57.2
      - name: Validate CloudFormation templates
        run: |
          "$RUNNER_TEMP/cfn-lint/bin/cfn-lint" deploy/aws/onlineprorab-storage.yaml
