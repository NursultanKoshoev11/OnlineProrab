name: Local stack E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'website/**'
      - '.github/workflows/e2e.yml'

permissions:
  contents: read

concurrency:
  group: local-stack-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  E2E_COMPOSE_FILE: backend/e2e/docker-compose.e2e.yml

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.areas.outputs.api }}
      android: ${{ steps.areas.outputs.android }}
    steps:
      - name: List changed files
        id: areas
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        shell: bash
        run: |
          set -uo pipefail
          # Any doubt (manual run, new branch, API error, huge diff) runs everything.
          files=""
          run_all=true
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')" && run_all=false
          elif [[ "$GITHUB_EVENT_NAME" == push && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            compare="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE_SHA...$GITHUB_SHA")" &&
              [[ "$(jq '.files | length' <<<"$compare")" -lt 300 ]] &&
              files="$(jq -r '.files[].filename' <<<"$compare")" && run_all=false
          fi
          echo "$files"
          area() {
            if [[ "$run_all" == true ]] || grep -Eq "$2" <<<"$files"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          area api '^(backend/|website/|\.github/workflows/e2e\.yml$)'
          # Emulator jobs are the most expensive; run them only for app changes.
          area android '^(mobile/|backend/e2e/|\.github/workflows/e2e\.yml$)'

  api-e2e:
    name: API E2E on ephemeral local stack
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Generate throwaway credentials for the fake FCM server
        run: |
          set -euo pipefail
          credentials="$(bash backend/e2e/fake-fcm/credentials.sh)"
          # The key is generated per run and only signs requests to the fake
          # token endpoint inside the compose network.
          {
            echo 'E2E_FCM_SERVICE_ACCOUNT_JSON<<E2E_FCM_JSON_EOF'
            echo "$credentials"
            echo 'E2E_FCM_JSON_EOF'
          } >> "$GITHUB_ENV"

      - name: Start local API stack
        run: docker compose -f "$E2E_COMPOSE_FILE" up -d --build postgres api

      - name: Seed local users and projects
        run: docker compose -f "$E2E_COMPOSE_FILE" run --rm seed

      - name: Run API E2E suite (authorization, flows, notifications, payments)
        working-directory: backend
        run: go test -tags=e2e -count=1 -v ./e2e

      - name: Save API logs on failure
        if: failure()
        run: docker compose -f "$E2E_COMPOSE_FILE" logs --no-color api fake-fcm fake-obank > "$RUNNER_TEMP/api-e2e.log" || true

      - name: Upload API logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-api-e2e-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/api-e2e.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop local API stack
        if: always()
        run: docker compose -f "$E2E_COMPOSE_FILE" down -v

  mobile-maestro-e2e:
    name: Android Maestro against local stack
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-24.04  # emulator jobs are killed on the ubuntu-26.04 image
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        # The hosted runner image no longer leaves room for the Android SDK,
        # emulator image and Gradle build; drop toolchains these jobs never use.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \n            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \n            /usr/local/lib/heroku /opt/microsoft /opt/google/chrome /usr/lib/jvm/temurin-8-jdk-amd64
          docker image prune --all --force >/dev/null
          df -h /

      - name: Start local API stack
        run: docker compose -f "$E2E_COMPOSE_FILE" up -d --build postgres api

      - name: Seed local users and projects
        run: docker compose -f "$E2E_COMPOSE_FILE" run --rm seed

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Prepare Android platform
        working-directory: mobile
        run: python3 tool/prepare_android.py

      - name: Install and verify Android NDK
        working-directory: mobile
        run: python3 tool/install_android_ndk.py

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Cache Gradle dependencies
        # Without a cache every run downloads the whole Gradle and Kotlin
        # toolchain from Maven Central, which answers parallel CI jobs with
        # 429 Too Many Requests and fails the APK build.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock', 'mobile/tool/prepare_android.py', 'mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Use Google's Maven Central mirror for Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cp mobile/tool/ci-maven-mirror.init.gradle ~/.gradle/init.d/

      - name: Build debug APK for local emulator API
        working-directory: mobile
        shell: bash
        run: |
          # Retry once more after a pause: Maven Central rate-limits CI
          # runners and a short wait usually clears it.
          for attempt in 1 2 3; do
            flutter build apk --debug \
              --dart-define=API_BASE_URL=http://10.0.2.2:8080 \
              --dart-define=OFFLINE_DEMO=false \
              --dart-define=DISABLE_PUSH_NOTIFICATIONS=true && exit 0
            echo "APK build attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Release build memory before the emulator starts
        # The Gradle and Kotlin daemons keep several GB after the APK build;
        # with the 4 GB emulator the runner was shut down mid-test.
        run: |
          pkill -f GradleDaemon || true
          pkill -f KotlinCompileDaemon || true
          free -h

      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          maestro_version='2.12.0'
          maestro_sha256='a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e'
          archive="$RUNNER_TEMP/maestro.zip"
          curl --fail --silent --show-error --location \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${maestro_version}/maestro.zip" \
            --output "$archive"
          printf '%s  %s\n' "$maestro_sha256" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/maestro"
          unzip -q "$archive" -d "$RUNNER_TEMP/maestro"
          find "$RUNNER_TEMP/maestro" -type f -name maestro -exec chmod +x {} +
          maestro_bin="$(find "$RUNNER_TEMP/maestro" -type f -name maestro -perm -111 -print -quit)"
          test -n "$maestro_bin"
          echo "$(dirname "$maestro_bin")" >> "$GITHUB_PATH"
          "$maestro_bin" --version

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Maestro on Android emulator
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096
          disable-animations: true
          emulator-boot-timeout: 1200
          cores: 4
          script: |
            bash mobile/tool/run_maestro_e2e.sh

      - name: Upload Maestro screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-maestro-e2e-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/maestro-results.xml
            ${{ runner.temp }}/maestro-cli.log
            ${{ runner.temp }}/maestro-startup.png
            ${{ runner.temp }}/maestro-failure.png
            ${{ runner.temp }}/maestro-ui.xml
            ${{ runner.temp }}/maestro-logcat.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Save API logs on failure
        if: failure()
        run: docker compose -f "$E2E_COMPOSE_FILE" logs --no-color api > "$RUNNER_TEMP/api-e2e.log" || true

      - name: Upload API logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-mobile-api-e2e-logs-${{ github.run_number }}
          path: ${{ runner.temp }}/api-e2e.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stop local API stack
        if: always()
        run: docker compose -f "$E2E_COMPOSE_FILE" down -v

  mobile-monkey-e2e:
    name: Android monkey (random input) against local stack
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.android == 'true') }}
    runs-on: ubuntu-24.04  # emulator jobs are killed on the ubuntu-26.04 image
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free runner disk space
        # The hosted runner image no longer leaves room for the Android SDK,
        # emulator image and Gradle build; drop toolchains these jobs never use.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \n            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \n            /usr/local/lib/heroku /opt/microsoft /opt/google/chrome /usr/lib/jvm/temurin-8-jdk-amd64
          docker image prune --all --force >/dev/null
          df -h /

      - name: Start local API stack
        run: docker compose -f "$E2E_COMPOSE_FILE" up -d --build postgres api

      - name: Seed local users and projects
        run: docker compose -f "$E2E_COMPOSE_FILE" run --rm seed

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.44.4'
          cache: true

      - name: Prepare Android platform
        working-directory: mobile
        run: python3 tool/prepare_android.py

      - name: Install and verify Android NDK
        working-directory: mobile
        run: python3 tool/install_android_ndk.py

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get --enforce-lockfile

      - name: Cache Gradle dependencies
        # Without a cache every run downloads the whole Gradle and Kotlin
        # toolchain from Maven Central, which answers parallel CI jobs with
        # 429 Too Many Requests and fails the APK build.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('mobile/pubspec.lock', 'mobile/tool/prepare_android.py', 'mobile/android/**/*.gradle*', 'mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Use Google's Maven Central mirror for Gradle
        run: |
          mkdir -p ~/.gradle/init.d
          cp mobile/tool/ci-maven-mirror.init.gradle ~/.gradle/init.d/

      - name: Build debug APK for local emulator API
        working-directory: mobile
        shell: bash
        run: |
          # Retry once more after a pause: Maven Central rate-limits CI
          # runners and a short wait usually clears it.
          for attempt in 1 2 3; do
            flutter build apk --debug \
              --dart-define=API_BASE_URL=http://10.0.2.2:8080 \
              --dart-define=OFFLINE_DEMO=false \
              --dart-define=DISABLE_PUSH_NOTIFICATIONS=true && exit 0
            echo "APK build attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          exit 1

      - name: Release build memory before the emulator starts
        # The Gradle and Kotlin daemons keep several GB after the APK build;
        # with the 4 GB emulator the runner was shut down mid-test.
        run: |
          pkill -f GradleDaemon || true
          pkill -f KotlinCompileDaemon || true
          free -h

      - name: Install pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          maestro_version='2.12.0'
          maestro_sha256='a6044a84542f522f434c5dc3d609e60c7446d423f3ed1b2ae513f5c48663ec5e'
          archive="$RUNNER_TEMP/maestro.zip"
          curl --fail --silent --show-error --location \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${maestro_version}/maestro.zip" \
            --output "$archive"
          printf '%s  %s\n' "$maestro_sha256" "$archive" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/maestro"
          unzip -q "$archive" -d "$RUNNER_TEMP/maestro"
          find "$RUNNER_TEMP/maestro" -type f -name maestro -exec chmod +x {} +
          maestro_bin="$(find "$RUNNER_TEMP/maestro" -type f -name maestro -perm -111 -print -quit)"
          test -n "$maestro_bin"
          echo "$(dirname "$maestro_bin")" >> "$GITHUB_PATH"
          "$maestro_bin" --version

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run monkey rounds on Android emulator
        uses: ReactiveCircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096
          disable-animations: true
          emulator-boot-timeout: 1200
          cores: 4
          script: |
            bash mobile/tool/run_monkey_e2e.sh

      - name: Check API for server errors during random input
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/monkey"
          docker compose -f "$E2E_COMPOSE_FILE" logs --no-color api > "$RUNNER_TEMP/monkey/api.log" 2>&1 || true
          # Requests are logged as JSON with an integer "status"; any 5xx
          # caused by random input is a server defect.
          if grep -E '"status":5[0-9]{2}' "$RUNNER_TEMP/monkey/api.log" > "$RUNNER_TEMP/monkey/api-5xx.log"; then
            echo "::error title=Server errors during monkey testing::$(wc -l < "$RUNNER_TEMP/monkey/api-5xx.log") requests returned 5xx"
            head -n 20 "$RUNNER_TEMP/monkey/api-5xx.log"
            exit 1
          fi
          echo "No 5xx responses from the API during monkey testing."

      - name: Upload monkey results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stroy-monkey-e2e-${{ github.run_number }}
          path: ${{ runner.temp }}/monkey
          if-no-files-found: warn
          retention-days: 7

      - name: Stop local API stack
        if: always()
        run: docker compose -f "$E2E_COMPOSE_FILE" down -v
