name: Resolve iOS export compliance

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: App Store Connect build number to mark as using only exempt encryption
        required: true
        default: '375'
        type: string

permissions: {}

jobs:
  resolve:
    name: Resolve build export compliance
    runs-on: ubuntu-latest
    environment: production-mobile
    steps:
      - name: Set usesNonExemptEncryption to false
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8: ${{ secrets.ASC_PRIVATE_KEY_P8 }}
          APP_ID: '6827116987'
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'PyJWT[crypto]==2.10.1'
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          import jwt

          base_url = "https://api.appstoreconnect.apple.com/v1"
          app_id = os.environ["APP_ID"]
          build_number = os.environ["BUILD_NUMBER"].strip()
          now = int(time.time())
          private_key = os.environ["ASC_PRIVATE_KEY_P8"].replace("\\r\\n", "\\n")
          token = jwt.encode(
              {
                  "iss": os.environ["ASC_ISSUER_ID"],
                  "iat": now,
                  "exp": now + 900,
                  "aud": "appstoreconnect-v1",
              },
              private_key,
              algorithm="ES256",
              headers={"kid": os.environ["ASC_KEY_ID"], "typ": "JWT"},
          )
          headers = {
              "Authorization": f"Bearer {token}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          def request(method, path, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(
                  base_url + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      raw = response.read()
                      return response.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  detail = error.read().decode("utf-8", "replace")
                  raise RuntimeError(f"Apple API {method} {path} failed ({error.code}): {detail}") from error

          query = urllib.parse.urlencode(
              {
                  "filter[app]": app_id,
                  "filter[version]": build_number,
                  "filter[platform]": "IOS",
                  "fields[builds]": "version,processingState,usesNonExemptEncryption,appEncryptionDeclaration",
                  "limit": "50",
              }
          )

          build = None
          for attempt in range(30):
              _, payload = request("GET", f"/builds?{query}")
              candidates = payload.get("data", []) if payload else []
              if candidates:
                  build = candidates[0]
                  state = build.get("attributes", {}).get("processingState")
                  print(
                      f"Found build id={build['id']} version={build.get('attributes', {}).get('version')} processingState={state}"
                  )
                  if state == "VALID":
                      break
              if attempt == 29:
                  raise RuntimeError(f"Build {build_number} was not processed as VALID in time")
              time.sleep(20)

          attrs = build.get("attributes", {})
          if attrs.get("usesNonExemptEncryption") is False:
              print(f"Build {build_number} already has export compliance resolved.")
          else:
              body = {
                  "data": {
                      "type": "builds",
                      "id": build["id"],
                      "attributes": {"usesNonExemptEncryption": False},
                  }
              }
              status, updated = request("PATCH", f"/builds/{build['id']}", body)
              updated_attrs = (updated or {}).get("data", {}).get("attributes", {})
              if updated_attrs.get("usesNonExemptEncryption") is not False:
                  raise RuntimeError(
                      f"Apple accepted PATCH ({status}) but did not return usesNonExemptEncryption=false: {updated_attrs}"
                  )
              print(f"Build {build_number} export compliance resolved via App Store Connect API.")
          PY
