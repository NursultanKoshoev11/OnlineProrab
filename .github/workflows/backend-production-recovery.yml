name: Backend Production Recovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, stroy-prod]
    timeout-minutes: 10
    environment: production-api
    env:
      DEPLOY_HOST: ${{ vars.API_DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.API_DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.API_DEPLOY_PATH }}
      COMPOSE_PROJECT: ${{ vars.API_DEPLOY_COMPOSE_PROJECT }}
      DEPLOY_SSH_KEY: ${{ secrets.API_DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.API_DEPLOY_KNOWN_HOSTS }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Restore the managed API release
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_HOST" && -n "$DEPLOY_USER" && -n "$DEPLOY_PATH" && -n "$COMPOSE_PROJECT" ]]
          [[ -n "$DEPLOY_SSH_KEY" && -n "$DEPLOY_KNOWN_HOSTS" ]]
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/api_recovery"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/api_recovery_known_hosts"
          chmod 600 "$HOME/.ssh/api_recovery" "$HOME/.ssh/api_recovery_known_hosts"
          ssh_options=(-o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/api_recovery_known_hosts" -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -i "$HOME/.ssh/api_recovery")
          printf -v remote_command 'bash -s -- %q %q' "$DEPLOY_PATH" "$COMPOSE_PROJECT"
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "$remote_command" <<'REMOTE'
          set -Eeuo pipefail
          deploy_path="$1"
          compose_project="$2"
          env_file="$deploy_path/.env"
          current_link="$deploy_path/current"
          if [[ -L "$current_link" ]]; then
            current_release="$(readlink -f -- "$current_link")"
          else
            echo "managed current release pointer is missing; selecting the previous release recorded by the interrupted deploy"
            latest_release="$(find "$deploy_path/releases" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
            previous_ref="$(cat -- "$latest_release/previous-release" 2>/dev/null || true)"
            if [[ "$previous_ref" =~ ^releases/(baseline|[0-9a-f]{40})$ && -d "$deploy_path/$previous_ref" ]]; then
              current_release="$deploy_path/$previous_ref"
            else
              current_release="$latest_release"
            fi
          fi
          compose_file="$current_release/backend/docker-compose.prod.yml"
          image_ref="$(cat -- "$current_release/image-tag")"
          [[ "$current_release" == "$deploy_path/releases/"* ]]
          [[ "$image_ref" =~ ^stroy-api:(baseline|[0-9a-f]{40})$ ]]
          [[ -f "$env_file" && -f "$compose_file" ]]
          echo "Restoring $image_ref from $current_release"
          stale_ids="$(docker ps --all --quiet --filter name=stroy-api)"
          if [[ -n "$stale_ids" ]]; then
            docker rm --force $stale_ids
          fi
          API_IMAGE="$image_ref" docker compose --project-name "$compose_project" --env-file "$env_file" --file "$compose_file" up --detach --no-build --pull never api
          for attempt in $(seq 1 36); do
            status="$(docker inspect --format '{{.State.Health.Status}}' stroy-api 2>/dev/null || true)"
            echo "health attempt $attempt: ${status:-missing}"
            if [[ "$status" == healthy ]]; then
              exit 0
            fi
            if [[ "$status" == unhealthy || "$status" == exited || "$status" == dead ]]; then
              docker logs --tail 120 stroy-api || true
              exit 1
            fi
            sleep 5
          done
          docker logs --tail 120 stroy-api || true
          exit 1
          REMOTE
        if: always()
        shell: bash
        continue-on-error: false
      - name: Remove SSH credentials
        if: always()
        run: rm -f "$HOME/.ssh/api_recovery" "$HOME/.ssh/api_recovery_known_hosts"
